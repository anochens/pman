<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Pman</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #03060d;
            /* Swipes steer the guy, so they must not scroll, zoom or select */
            touch-action: none;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>

<canvas id="myCanvas"></canvas>

<script>
    // ---- The world ----

    // Each level's maze size in squares, how many enemies it has and how
    // often they step. straightness is the chance the maze's corridors keep
    // going the same way rather than turning, so early mazes have few
    // turns; extraGapChance is the chance each wall between two rooms is
    // opened as well, adding loops. Level 1 is a tiny, nearly straight maze
    // with one slow enemy; each level grows a little. Levels past the end
    // of the list repeat its last entry, with the enemies a little faster
    // each time. Mazes are built on a lattice, and the guy's start (bottom
    // middle) and the side tunnel (middle row) must land on open rooms, so
    // both sizes must be 3 more than a multiple of 4.
    const LEVEL_LAYOUTS = [
        { cols: 7, rows: 7, enemyCount: 1, enemyStepMs: 1500, straightness: 0.9, extraGapChance: 0 },
        { cols: 11, rows: 7, enemyCount: 1, enemyStepMs: 1400, straightness: 0.8, extraGapChance: 0.02 },
        { cols: 11, rows: 11, enemyCount: 1, enemyStepMs: 1300, straightness: 0.7, extraGapChance: 0.04 },
        { cols: 15, rows: 11, enemyCount: 2, enemyStepMs: 1250, straightness: 0.6, extraGapChance: 0.06 },
        { cols: 15, rows: 15, enemyCount: 2, enemyStepMs: 1200, straightness: 0.5, extraGapChance: 0.08 },
        { cols: 19, rows: 15, enemyCount: 2, enemyStepMs: 1100, straightness: 0.4, extraGapChance: 0.1 },
        { cols: 19, rows: 19, enemyCount: 3, enemyStepMs: 1000, straightness: 0.3, extraGapChance: 0.12 },
        { cols: 19, rows: 19, enemyCount: 3, enemyStepMs: 1000, straightness: 0.15, extraGapChance: 0.14 },
        { cols: 19, rows: 19, enemyCount: 3, enemyStepMs: 1000, straightness: 0, extraGapChance: 0.15 },
    ];

    // The current level's maze size, the row with the side tunnel (walking
    // off one edge brings you in at the other), and the guy's start square:
    // bottom middle, facing down the longest open corridor from there, so
    // walking forward always gets him going. Set by startLevel.
    let worldCols = LEVEL_LAYOUTS[0].cols;
    let worldRows = LEVEL_LAYOUTS[0].rows;
    let tunnelRow = Math.floor(worldRows / 2);
    let guyStartSquare = [Math.floor(worldCols / 2), worldRows - 2];

    const STEP_DIRECTIONS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

    // No open area may be bigger than this many squares each way
    const OPEN_AREA_MAX_SIZE = 2;

    // About half of generated mazes pass first time. The rest have a dead
    // end that could not be opened without leaving a wall on its own, so
    // they are thrown away and rebuilt.
    const MAZE_GENERATION_MAX_ATTEMPTS = 50;

    // ---- The guy (you) ----

    // You see the maze through the guy's eyes. He walks freely, any
    // distance and facing any way: holding Up/W walks forward, Down/S back,
    // A/D step sideways, and Left/Right turn him round smoothly for as long
    // as they are held. The guy's clock runs every GUY_UPDATE_INTERVAL_MS.
    const GUY_WALK_SQUARES_PER_MS = 1 / 450;
    const GUY_TURN_RADIANS_PER_MS = Math.PI / 1100;
    const GUY_UPDATE_INTERVAL_MS = 16;

    // Turning speeds up over this long after a turn key goes down, so a
    // short tap nudges the view a little instead of jerking it round
    const GUY_TURN_RAMP_MS = 180;

    // How far his body reaches from his middle, in squares; he can't get
    // closer to a wall than this. Brushing a wall corner next to an
    // opening slides him into the opening, so passages are easy to enter.
    const GUY_RADIUS_SQUARES = 0.25;

    // A clock tick longer than this (the tab was in the background) moves
    // him only this far, so he never jumps through a wall
    const GUY_MAX_TICK_MS = 50;

    // On a phone, a touch held still this long becomes a hold (walking)
    // rather than a tap
    const TOUCH_HOLD_MS = 180;

    // On a phone, sliding a finger sideways turns him this much per pixel,
    // and a swipe up or down walks him for about one square
    const TOUCH_TURN_RADIANS_PER_PX = 0.012;
    const TOUCH_SWIPE_WALK_MS = 450;

    // A touch that moves less than this is a tap; more is a swipe
    const SWIPE_MIN_DISTANCE_PX = 30;

    // Standard game controller button numbers, and how far the left stick
    // must be pushed to count as a D-pad press
    const GAMEPAD_BUTTON = {
        fire: 0,
        stepLeft: 4,
        stepRight: 5,
        fireTrigger: 7,
        start: 9,
        up: 12,
        down: 13,
        left: 14,
        right: 15,
    };
    const GAMEPAD_STICK_THRESHOLD = 0.5;

    // The left stick turns him once pushed sideways further than this
    const GAMEPAD_STICK_DEADZONE = 0.2;

    // The controls hint for each way of playing
    const CONTROLS_HINTS = {
        keyboard: "Up/Down or W/S: walk   Left/Right: turn   A/D: step sideways   Space: blow bubbles",
        gamepad: "D-pad up/down: walk   D-pad left/right: turn   LB/RB: step sideways   A: blow bubbles",
        touch: "Hold: walk   Swipe up/down: one step   Slide left/right: turn   Tap: blow bubbles",
    };

    // How to go on from the death and level complete screens, for each way
    // of playing
    const CONTINUE_PROMPTS = {
        keyboard: "Space",
        gamepad: "A",
        touch: "Tap",
    };

    // Keys held to walk forward/back, step sideways, and turn
    const MOVE_KEYS = {
        ArrowUp: { forward: 1 }, w: { forward: 1 }, W: { forward: 1 },
        ArrowDown: { forward: -1 }, s: { forward: -1 }, S: { forward: -1 },
        a: { strafe: -1 }, A: { strafe: -1 }, d: { strafe: 1 }, D: { strafe: 1 },
        ArrowLeft: { turn: -1 }, ArrowRight: { turn: 1 },
    };

    // ---- Enemies ----

    // From the first level after the last layout, enemies move this many
    // times faster each level than the level before
    const ENEMY_SPEEDUP_PER_LEVEL = 1.05;

    // An enemy catches the guy (or, frightened, gets eaten) once its middle
    // is this close to his
    const CATCH_DISTANCE_SQUARES = 0.55;

    // An enemy this close to the middle of the square it is heading for
    // already picks its next one and curves toward it, cutting the corner
    const ENEMY_CORNER_CUT_SQUARES = 0.3;

    // Power pellets: big dots, one in each quarter of the maze, that let the
    // guy eat enemies for a while. Frightened enemies turn grey and wander
    // at random, flashing white near the end. An eaten or shot enemy fades
    // to a ghost, backs off and walks at double speed to the corner
    // farthest from the guy, going round him rather than through him,
    // harmless and not edible, then goes back to normal once it is
    // there and has been a ghost for RETURNING_ENEMY_MIN_MS, so in small
    // mazes it doesn't bounce straight back.
    const POWER_PELLET_POINTS = 50;
    const FRIGHTENED_DURATION_MS = 10000;
    const FRIGHTENED_FLASH_FINAL_MS = 3000;
    const FRIGHTENED_FLASH_PERIOD_MS = 250;
    const EATEN_ENEMY_POINTS = 200;
    const RETURNING_ENEMY_SPEEDUP = 2;
    const RETURNING_ENEMY_MIN_MS = 8000;

    // ---- Dots, score ----

    // Dots are laid in runs that cover about this share of open squares.
    // Every group of touching dots has at least DOT_RUN_MIN_LENGTH dots.
    const DOT_SHARE = 0.6;
    const DOT_RUN_MIN_LENGTH = 5;
    const DOT_RUN_MAX_LENGTH = 10;
    const DOT_RUN_STRAIGHT_CHANCE = 0.7;
    const POINTS_PER_DOT = 10;

    // ---- Shooting ----

    // Space fires a bullet straight ahead, the way the guy is looking. It
    // stops at the first wall. An enemy it hits scores points and walks
    // back to the far corner, the same as an eaten one.
    const BULLET_SPEED_SQUARES_PER_MS = 0.012;
    const BULLET_HIT_RADIUS_SQUARES = 0.4;
    const BULLET_UPDATE_INTERVAL_MS = 16;
    const SHOT_COOLDOWN_MS = 300;
    const SHOT_ENEMY_POINTS = 200;

    // ---- First-person view ----

    // The 3D view is VIEW_W by VIEW_H pixels, with the status bar under it.
    // A wall square looks VIEW_H tall from one square away.
    const VIEW_W = 800;
    const VIEW_H = 450;
    const FIELD_OF_VIEW_RADIANS = (66 * Math.PI) / 180;
    const MAX_RAY_STEPS = 80;

    // Everything fades into a dark green haze with distance: hardly at all
    // close by, half gone about FOG_HALF_DISTANCE_SQUARES away, and never
    // more than FOG_MAX_SHARE, so the far end of a corridor still shows
    const FOG_RGB = [3, 16, 9];
    const FOG_HALF_DISTANCE_SQUARES = 5.5;
    const FOG_MAX_SHARE = 0.94;

    // The floor is blacktop: dark asphalt with blotches, pits and small
    // pale stones, made once as a texture GRAVEL_TEXTURE_PX texels square
    // covering GRAVEL_TILE_SQUARES squares each way, and repeated. Smaller,
    // averaged copies of it are used further away so it doesn't sparkle.
    // The ceiling is the same picture, blurred and much darker, like rough
    // concrete. Both are worked out pixel by pixel at FLOOR_BUFFER_SCALE of
    // the view's resolution each frame.
    const GRAVEL_TEXTURE_PX = 256;
    const GRAVEL_TILE_SQUARES = 2;
    const GRAVEL_BASE_GREY = 36;
    const GRAVEL_STONES_PER_TEXEL = 1 / 14;
    const GRAVEL_PITS_PER_TEXEL = 1 / 40;
    const CEILING_SHADE = 0.32;
    const CEILING_BLUR_LEVEL = 3;
    const FLOOR_BUFFER_SCALE = 0.5;

    // Bubbles glow: each one in flight lights the floor, ceiling and walls
    // around it, and a bubble bursting gives a brighter flash that dies
    // away over BUBBLE_FLASH_MS. Light falls off with distance in squares;
    // past BUBBLE_LIGHT_REACH_SQUARES it is too faint to bother with.
    const BUBBLE_LIGHT_RGB = [110, 200, 255];
    const BUBBLE_LIGHT_STRENGTH = 0.55;
    const BUBBLE_FLASH_STRENGTH = 1.3;
    const BUBBLE_FLASH_MS = 450;
    const BUBBLE_LIGHT_FALLOFF = 3;
    const BUBBLE_LIGHT_REACH_SQUARES = 2.5;

    // Stopping after a walk dips the view for a moment. A bug within
    // CAMERA_SHAKE_DISTANCE_SQUARES shakes it, harder the closer it gets.
    // The world is drawn a touch larger than the view, so shaking never
    // shows its edges.
    const CAMERA_STOP_DIP_PX = 5;
    const CAMERA_STOP_DIP_MS = 260;
    const CAMERA_SHAKE_DISTANCE_SQUARES = 2.2;
    const CAMERA_SHAKE_MAX_PX = 5;
    const CAMERA_OVERSCAN_SCALE = 1.03;

    // Walls are Matrix-style green rain: each wall face is
    // MATRIX_COLUMNS_PER_WALL columns by MATRIX_ROWS_PER_WALL rows of
    // glyphs, with bright drops falling down every column at its own
    // speed, between MIN and MAX rows a second. Every corner gets a solid
    // black seam, WALL_SEAM_SHARE of a square wide each side, so corners
    // stand out; flat runs of wall have none. Faces running north-south
    // are drawn a little darker, as if lit from one side.
    const MATRIX_GLYPHS = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789Z:.=*+<>|";
    // Every wall starts green. A bubble that bursts on a wall slowly fades
    // its rain to the next colour in this list, over WALL_LOOK_CHANGE_MS.
    const MATRIX_PALETTE_RGBS = [
        [60, 255, 120],
        [60, 220, 255],
        [190, 120, 255],
        [255, 190, 60],
        [255, 100, 200],
    ];
    const WALL_LOOK_CHANGE_MS = 8000;
    const MATRIX_HEAD_WHITENESS = 0.8;
    const MATRIX_BACKGROUND_RGB = [2, 12, 5];
    const MATRIX_DIM_SHARE = 0.22;
    const MATRIX_GLYPH_PX = 16;
    const MATRIX_COLUMNS_PER_WALL = 8;
    const MATRIX_ROWS_PER_WALL = 10;
    const MATRIX_TILE_ROWS = 24;
    const MATRIX_TRAIL_ROWS = 8;
    const MATRIX_MIN_ROWS_PER_SECOND = 0.4;
    const MATRIX_MAX_ROWS_PER_SECOND = 1.2;
    const WALL_SEAM_RGB = [0, 0, 0];
    const WALL_SEAM_SHARE = 0.04;
    const SIDE_WALL_SHADE = 0.72;
    const WALL_STRIP_OVERLAP_W = 1.05;

    // Heights of things above the floor, as a share of wall height
    const DOT_HEIGHT_SHARE = 0.18;
    const DOT_RADIUS_SHARE = 0.035;
    const POWER_PELLET_RADIUS_SHARE = 0.09;
    const BULLET_HEIGHT_SHARE = 0.4;
    const BULLET_RADIUS_SHARE = 0.1;
    const ENEMY_HEIGHT_SHARE = 0.62;

    // The guy's view bobs as he walks, two bobs per square
    const HEAD_BOB_PX = 6;
    const HEAD_BOB_PER_SQUARE = 2;
    const WALK_BOB_LINGER_MS = 150;

    // The guy holds a toy bubble blaster in the lower right of the view,
    // angled in toward the crosshair: see-through blue plastic, like a
    // dollar-store bubble gun. It is a small 3D model built from boxes,
    // tubes and balls, drawn in perspective with glossy lighting; its
    // inside walls show through the outside ones. Firing kicks the blaster
    // back and a pop ring spreads from the nozzle. Each shot is a floating
    // bubble that starts BUBBLE_START_AHEAD_SQUARES in front of the guy.
    //
    // Model sizes are in blaster units, x to the right, y down, z away from
    // the eye; the barrel points along +z. Each part has a colour and how
    // solid it looks (1 is fully solid).
    const BLASTER_BODY_RGB = [90, 225, 190];
    const BLASTER_BODY_ALPHA = 0.5;
    const BLASTER_GRIP_RGB = [42, 207, 166];
    const BLASTER_GRIP_ALPHA = 0.55;
    const BLASTER_BARREL_RGB = [30, 190, 150];
    const BLASTER_BARREL_ALPHA = 0.55;
    const BLASTER_RING_RGB = [215, 255, 240];
    const BLASTER_RING_ALPHA = 0.75;
    const BLASTER_TANK_RGB = [19, 150, 120];
    const BLASTER_TANK_ALPHA = 0.8;
    const BLASTER_NOZZLE_TIP_Z = 0.7;

    // How finely the tubes are built; balls are drawn as smooth shaded discs
    const BLASTER_CYLINDER_SEGMENTS = 36;

    // Where the blaster sits in front of the eye and how it is angled:
    // to the right, down, and forward, turned in toward the middle (negative
    // yaw) and tipped up a little (positive pitch). FOCAL_PX sets how strong
    // the perspective is.
    const BLASTER_POSITION = [0.24, 0.27, 0.62];
    const BLASTER_YAW_RADIANS = -0.2;
    const BLASTER_PITCH_RADIANS = 0.1;
    const BLASTER_FOCAL_PX = VIEW_H * 0.95;

    // Light comes from above, to the left and slightly behind the eye.
    // Surfaces get AMBIENT plus DIFFUSE light, and a white glossy shine of
    // SPECULAR strength, sharpness SHININESS.
    const BLASTER_LIGHT_DIRECTION = normalizeVector([-0.5, -0.8, -0.35]);
    const BLASTER_AMBIENT = 0.32;
    const BLASTER_DIFFUSE = 0.75;
    const BLASTER_SPECULAR = 0.6;
    const BLASTER_SHININESS = 28;

    // Firing kicks the blaster back and up, settling over BLASTER_KICK_MS
    const BLASTER_KICK_MS = 160;
    const BLASTER_KICK_BACK = 0.07;
    const BLASTER_KICK_PITCH_RADIANS = 0.14;
    const NOZZLE_POP_MS = 150;
    const BUBBLE_FILL_COLOR = "rgba(120, 235, 205, 0.28)";
    const BUBBLE_EDGE_COLOR = "rgba(220, 255, 245, 0.95)";
    const BUBBLE_SHINE_COLOR = "rgba(255, 255, 255, 0.9)";
    const BUBBLE_START_AHEAD_SQUARES = 0.3;

    // A new bubble is drawn coming out of the blaster's nozzle: for its
    // first BUBBLE_LAUNCH_MS it glides from the tip, where it is
    // BUBBLE_LAUNCH_RADIUS across in blaster units, to where it really is
    // in the maze, then flies on as normal. Only the drawing does this; the
    // bubble's real path, and what it hits, is unchanged.
    const BUBBLE_LAUNCH_MS = 200;
    const BUBBLE_LAUNCH_RADIUS = 0.045;

    const DOT_COLOR = "#2acfa6";

    // Power pellets are swirled with the rainbow, turning once every
    // PELLET_SPIN_MS; the first colour is repeated at the end so the swirl
    // joins up
    const PELLET_RAINBOW_COLORS = ["#ff3b3b", "#ff9f1c", "#ffe11c", "#3ad15a", "#2fa8ff", "#8a5cff", "#ff4fd8", "#ff3b3b"];
    const PELLET_SPIN_MS = 1500;

    // While powered up, a single rainbow ring travels smoothly up and down
    // the blaster, from BACK_Z to FRONT_Z (blaster units along the barrel)
    // and back once every BLASTER_RING_TRAVEL_MS. It is HALF_WIDTH either
    // side of its middle, and its colours spin round once every SPIN_MS.
    const BLASTER_RING_BACK_Z = -0.15;
    const BLASTER_RING_FRONT_Z = 0.67;
    const BLASTER_RING_HALF_WIDTH = 0.035;
    const BLASTER_RING_TRAVEL_MS = 1600;
    const BLASTER_RING_SPIN_MS = 2000;
    const BLASTER_TUBE_SLICE_LENGTH = 0.03;

    // Enemies are bugs, drawn into a canvas 4 by 3 blocks of this many
    // pixels, then scaled into the view. Their legs lift this many blocks
    // as they scuttle, switching every BUG_LEG_STEP_MS; each has dark spots
    // on its shell ([across, down, radius] in blocks from the shell's
    // middle) and a soft shadow on the floor under it.
    const ENEMY_SPRITE_BLOCK_PX = 60;
    const BUG_LEG_LIFT_BLOCKS = 0.18;
    const BUG_LEG_STEP_MS = 140;
    const BUG_SPOTS_BLOCKS = [[-0.45, -0.1, 0.17], [0.42, 0.05, 0.2], [-0.35, 0.55, 0.15], [0.4, 0.62, 0.13]];
    const BUG_SHADOW_ALPHA = 0.45;

    // A bug crawling nearly straight toward or away from the guy keeps
    // facing the way it was until it is crossing the view by this much
    // (about 0.65 is straight across), so it doesn't flicker between sides
    const BUG_FLIP_ACROSS_SHARE = 0.15;

    // A bug heading this close to straight at the guy is seen face on
    const BUG_FRONT_VIEW_RADIANS = Math.PI / 4;
    const BUG_OUTLINE_COLOR = "rgba(0, 0, 0, 0.55)";

    // What makes the bugs look mean: glowing eyes (from the middle out)
    // under dark lids and brows slanted BUG_BROW_TILT_RADIANS into a
    // scowl, pale-tipped pincers, spikes along the shell and a spur on
    // each knee. Sizes are in blocks.
    const BUG_EYE_COLORS = ["#fff6a0", "#ffc21a", "#ff5a00", "#a01800"];
    const BUG_EYE_GLOW_COLOR = "rgba(255, 120, 0, 0.9)";
    const BUG_EYE_RADIUS_BLOCKS = 0.2;
    const BUG_LID_COLOR = "#120404";
    const BUG_FANG_COLOR = "#f2ead2";
    const BUG_BROW_TILT_RADIANS = 0.55;
    const BUG_SHELL_SPIKE_COUNT = 7;
    const BUG_SHELL_SPIKE_BLOCKS = 0.42;
    const BUG_LEG_SPUR_BLOCKS = 0.3;
    const BUG_HEAD_DARKEN = -0.3;

    // The bullseye on a frightened enemy: ring sizes in blocks from the
    // outside in, coloured in turn
    const TARGET_RING_RADII_BLOCKS = [1.05, 0.78, 0.5, 0.24];
    const TARGET_RING_COLORS = ["#e01e1e", "#ffffff"];

    // Each enemy is one solid colour, in this order: critical, high and
    // medium severity
    const ENEMY_BODY_COLORS = ["#e5484d", "#f76b15", "#b48cff"];
    const FRIGHTENED_ENEMY_COLOR = "#a0a0a0";
    const FRIGHTENED_FLASH_COLOR = "#ffffff";

    // An enemy walking back is a faint see-through ghost
    const RETURNING_ENEMY_COLOR = "#c8c8c8";
    const RETURNING_ENEMY_ALPHA = 0.3;

    // Automap in the top-right corner of the view: the original flat 2D
    // game, drawn at its own size (each square MAP_CELL_W by MAP_CELL_H
    // pixels, characters in blocks of MAP_BLOCK_PX) and shrunk by
    // MINIMAP_SCALE. Walls are stone bars half a square thick with a
    // bevelled edge, characters are their blocky shapes, and a small white
    // wedge in front of the guy shows which way he faces.
    const MAP_BLOCK_PX = 10;
    const MAP_CELL_W = 4 * MAP_BLOCK_PX;
    const MAP_CELL_H = 3 * MAP_BLOCK_PX;
    const MINIMAP_SCALE = 0.3;
    const MINIMAP_MARGIN_PX = 10;
    const MAP_WALL_BEVEL_PX = 3;
    const MAP_WALL_FACE_COLOR = "#1f3a5a";
    const MAP_WALL_LIGHT_COLOR = "#2acfa6";
    const MAP_WALL_DARK_COLOR = "#0a1422";
    const MAP_DOT_RADIUS_PX = 3;
    const MAP_PELLET_RADIUS_PX = 7;
    const MAP_GUY_COLORS = { left: "red", top: ["blue", "green"], right: "orange" };
    const MAP_ENEMY_SCALE = 1.5;
    const MAP_FACING_WEDGE_COLOR = "#ffffff";

    const HUD_HEIGHT_PX = 56;

    // Helper arrows (see drawGuideArrows): enemy arrows show within
    // GUIDE_ENEMY_MAX_STEPS walking steps, on an oval this far out from
    // the crosshair. As the enemy nears, its arrow and bug icon grow from
    // MIN to MAX size and from FAR_ALPHA to fully solid; within
    // GUIDE_CLOSE_STEPS the arrow flashes, dimming to BLINK_ALPHA every
    // other BLINK_MS. The dot arrow shows once DOT_GUIDE_MAX_LEFT or fewer
    // dots and pellets are left, on the same oval.
    const GUIDE_ENEMY_MAX_STEPS = 10;
    const GUIDE_RING_RADIUS_X_PX = 170;
    const GUIDE_RING_RADIUS_Y_PX = 150;
    const GUIDE_ARROW_MIN_SIZE_PX = 5;
    const GUIDE_ARROW_MAX_SIZE_PX = 24;
    const GUIDE_BUG_ICON_MIN_W_PX = 12;
    const GUIDE_BUG_ICON_MAX_W_PX = 48;
    const GUIDE_FAR_ALPHA = 0.5;
    const GUIDE_DOT_ICON_RADIUS_PX = 7;
    const GUIDE_CLOSE_STEPS = 3;
    const GUIDE_CLOSE_BLINK_MS = 150;
    const GUIDE_CLOSE_BLINK_ALPHA = 0.35;
    const GUIDE_DOT_ARROW_SIZE_PX = 16;
    const DOT_GUIDE_MAX_LEFT = 4;

    // When an enemy catches the guy the view floods with its colour, up to
    // DEATH_MAX_ALPHA solid, over DEATH_FADE_MS
    const DEATH_FADE_MS = 500;
    const DEATH_MAX_ALPHA = 0.88;

    // Each game starts with this many lives. Losing one replays the same
    // level; losing the last goes back to level 1.
    const LIVES_PER_GAME = 4;

    // Clearing a level stops play and sets off fireworks until the player
    // presses on: a new burst every FIREWORK_INTERVAL_MS, each a ring of
    // FIREWORK_SPARK_COUNT sparks flying out and falling over
    // FIREWORK_LIFE_MS. The view dims to LEVEL_COMPLETE_DIM_ALPHA.
    const FIREWORK_INTERVAL_MS = 350;
    const FIREWORK_LIFE_MS = 1400;
    const FIREWORK_SPARK_COUNT = 28;
    const FIREWORK_SPREAD_PX = 110;
    const FIREWORK_GRAVITY_PX = 60;
    const FIREWORK_COLORS = ["#ff4040", "#ffd23f", "#3fd2ff", "#7dff5a", "#ff6ae6", "#ffffff", "#ff9a2e"];
    const LEVEL_COMPLETE_DIM_ALPHA = 0.55;
    const LEVEL_COMPLETE_MIN_MS = 3000;

    // Start, death and level complete screens: the big word sits this far
    // above the middle and swells by PULSE_SHARE every PULSE_MS; lives and
    // the button sit this far below the middle; lives are drawn this many
    // times the status bar size
    const OVERLAY_TITLE_RAISE_PX = 40;
    const OVERLAY_PULSE_SHARE = 0.04;
    const OVERLAY_PULSE_MS = 1200;
    const OVERLAY_LIVES_OFFSET_Y_PX = 30;
    const OVERLAY_BUTTON_OFFSET_Y_PX = 90;
    const OVERLAY_LIFE_SCALE = 2;

    // The whole game (view plus status bar) is laid out at GAME_W by GAME_H
    // and scaled up or down to fill the window, keeping its shape and
    // centred, with black borders where the window's shape differs. It is
    // drawn at the screen's real resolution, so text stays sharp.
    const GAME_W = VIEW_W;
    const GAME_H = VIEW_H + HUD_HEIGHT_PX;
    const HUD_BACKGROUND_COLOR = "#0b1626";
    const HUD_TEXT_COLOR = "#2acfa6";
    const HUD_HINT_COLOR = "#c8d6e5";
    const HUD_PIE_EMPTY_COLOR = "#1f3a5a";

    // Status bar layout: where the top row starts and its middle, the gap
    // between items, the width of each life's blaster icon and the size
    // of the dots pie
    const HUD_LEFT_PX = 14;
    const HUD_ROW_MIDDLE_PX = 19;
    const HUD_GAP_PX = 28;
    const HUD_LIFE_ICON_W_PX = 30;
    const HUD_PIE_RADIUS_PX = 11;

    // ---- Game state ----

    const canvas = document.getElementById("myCanvas");
    const ctx = canvas.getContext("2d");

    let level = 1;

    // Score carries over between levels and resets on a new game. Replaying
    // a level after dying puts it back to what it was when the level began.
    let score = 0;
    let levelStartScore = 0;
    let livesLeft = LIVES_PER_GAME;
    let isDead = false;

    // Set when the last dot of a level is eaten: play stops and fireworks
    // go off until the player presses on to the next level
    let isLevelComplete = false;
    let levelCompleteMs = -Infinity;

    // Colour of the enemy that caught the guy, and when, for the death screen
    let deathColor = "#ff2020";
    let deathMs = -Infinity;

    // The maze for this level, holding:
    //   walls, dots,
    //   powerPellets        Sets of "x,y" keys of squares
    //   guy                 the guy:
    //     x, y                where his middle is, in squares
    //     squareX, squareY    the square his middle is in
    //     angle               the way he faces, in radians (0 is east, y
    //                         grows south)
    //     walkDistance        squares walked this level, for his head bob
    //     lastWalkMs          when he last moved
    //     turnStartMs         when the turn key now held went down, or null
    //   enemies             per enemy: the [x, y] square it is heading for
    //                       (or standing in)
    //   enemyFromSquares    per enemy: the square it last left
    //   enemyPositions      per enemy: where its middle is, { x, y } in squares
    //   enemyHeadings       per enemy: the way it last walked, in radians
    //   frightenedUntilMs   when the power runs out
    //   frightenedEnemyIndexes  enemies still frightened and edible
    //   returningEnemyCorners   eaten or shot enemies walking back (index -> [x, y])
    //   returningEnemyUntilMs   earliest each of those may stop being a ghost
    //   startingDotCount    dots and pellets the level began with
    //   wallLooks           walls that have been shot ("x,y" -> how far
    //                       through MATRIX_PALETTE_RGBS its colour was and
    //                       is heading, and when; see getWallLookPosition)
    //   bullets             { x, y, vx, vy, lastMs } in squares, velocity in
    //                       squares per ms
    //   flashes             { x, y, startMs }: where and when bubbles burst,
    //                       for their flash of light
    let maze = null;

    // How the game is fitted into the window: its scale and where its
    // top-left corner sits, in canvas pixels. Set by resizeCanvas.
    let gameTransform = { scale: 1, offsetX: 0, offsetY: 0 };

    // Movement keys currently held
    let heldKeys = new Set();

    // Phone: where the current touch began and where it was last seen; the
    // timer that turns a still touch into a hold; whether a hold has him
    // walking; and a short walk asked for by a swipe, forward (1) or back
    // (-1) until untilMs
    let touchStart = null;
    let touchLastX = 0;
    let touchHoldTimerId = null;
    let isTouchHolding = false;
    let touchSwipeWalk = { forward: 0, untilMs: -Infinity };

    // The turn waiting to be applied from sliding a finger, in radians
    let touchTurnRadians = 0;

    // When the guy's clock last ran, to move him by the time since
    let lastGuyUpdateMs = performance.now();

    // Game controller: walking and turning from its D-pad, stick and
    // shoulder buttons, and which buttons were down last time it was read,
    // to spot new presses
    let gamepadControls = { forward: 0, strafe: 0, turn: 0 };
    let previousGamepadButtons = {};

    // "keyboard", "touch" or "gamepad": whichever was used last, so the
    // controls hint matches what the player is holding
    let lastInputKind = "keyboard";

    let lastShotMs = -Infinity;

    // The game waits on a start screen until the player first clicks or
    // presses a key. When the game is shown inside another page, the
    // keyboard only reaches it after a click, so this keeps the enemies
    // from moving before the player can.
    let hasStarted = false;

    // The enemy clock runs every GUY_UPDATE_INTERVAL_MS, moving the enemies
    // by the time since it last ran. They hold still for one enemy step
    // interval after the level starts.
    let enemyTimerId = null;
    let lastEnemyUpdateMs = 0;
    let levelStartMs = 0;

    // Enemy pictures, drawn once per colour and reused every frame
    const enemySpriteCache = new Map();

    startGame();
    setInterval(stepGuy, GUY_UPDATE_INTERVAL_MS);
    setInterval(stepBullets, BULLET_UPDATE_INTERVAL_MS);

    resizeCanvas();
    requestAnimationFrame(renderFrame);

    window.addEventListener("resize", resizeCanvas);

    window.addEventListener("keydown", (event) => {
        if (event.key in MOVE_KEYS) {
            event.preventDefault();
            heldKeys = new Set([...heldKeys, event.key]);
            return;
        }
        if (event.key !== " ") {
            return;
        }
        event.preventDefault();
        if (isDead || isLevelComplete) {
            continueAfterPause();
            return;
        }
        shoot(performance.now());
    });

    // Any key on the keyboard switches the controls hint to keyboard keys
    window.addEventListener("keydown", () => {
        lastInputKind = "keyboard";
    }, { capture: true });

    window.addEventListener("keyup", (event) => {
        heldKeys = new Set([...heldKeys].filter((key) => key !== event.key));
    });

    // Keys released while the window is in the background never report it
    window.addEventListener("blur", () => {
        heldKeys = new Set();
    });

    // The first click or key press leaves the start screen. The level is
    // rebuilt then, so the enemies' clock starts from that moment. Touches
    // are handled with the swipe controls below instead.
    window.addEventListener("pointerdown", (event) => {
        if (event.pointerType === "touch") {
            return;
        }
        window.focus();
        beginPlaying();
    });
    window.addEventListener("keydown", beginPlaying, { capture: true });

    // ---- Phone: holds, swipes and taps ----
    // Press and hold anywhere to walk forward; let go to stop. Slide the
    // finger left or right to turn, while holding or not. Swipe up or down
    // to walk about one square forward or back. A quick tap blows a
    // bubble, and starts or restarts the game. A touch counts as a hold
    // once it has stayed still for TOUCH_HOLD_MS.
    window.addEventListener("touchstart", (event) => {
        event.preventDefault();
        const touch = event.changedTouches[0];
        touchStart = { x: touch.clientX, y: touch.clientY };
        touchLastX = touch.clientX;
        lastInputKind = "touch";
        clearTimeout(touchHoldTimerId);
        touchHoldTimerId = setTimeout(() => {
            if (touchStart !== null && !isPlayPaused()) {
                isTouchHolding = true;
            }
        }, TOUCH_HOLD_MS);
    }, { passive: false });

    // Sideways finger movement turns him as it happens. A finger that moves
    // far enough before becoming a hold is a swipe, never a hold.
    window.addEventListener("touchmove", (event) => {
        event.preventDefault();
        const touch = event.changedTouches[0];
        if (touchStart === null) {
            return;
        }
        if (!isPlayPaused()) {
            touchTurnRadians += (touch.clientX - touchLastX) * TOUCH_TURN_RADIANS_PER_PX;
        }
        touchLastX = touch.clientX;
        if (isTouchHolding) {
            return;
        }
        const distance = Math.hypot(touch.clientX - touchStart.x, touch.clientY - touchStart.y);
        if (distance >= SWIPE_MIN_DISTANCE_PX) {
            clearTimeout(touchHoldTimerId);
        }
    }, { passive: false });

    window.addEventListener("touchend", (event) => {
        event.preventDefault();
        clearTimeout(touchHoldTimerId);
        if (touchStart === null) {
            return;
        }
        const touch = event.changedTouches[0];
        const dx = touch.clientX - touchStart.x;
        const dy = touch.clientY - touchStart.y;
        const isTap = Math.hypot(dx, dy) < SWIPE_MIN_DISTANCE_PX;
        const wasHolding = isTouchHolding;
        touchStart = null;
        isTouchHolding = false;

        // Letting go of a hold just stops him walking
        if (wasHolding) {
            return;
        }
        if (!hasStarted) {
            beginPlaying();
            return;
        }
        if (isDead || isLevelComplete) {
            if (isTap) {
                continueAfterPause();
            }
            return;
        }
        if (isTap) {
            shoot(performance.now());
            return;
        }

        // Sideways swipes already turned him as the finger moved
        if (Math.abs(dx) > Math.abs(dy)) {
            return;
        }
        touchSwipeWalk = { forward: -Math.sign(dy), untilMs: performance.now() + TOUCH_SWIPE_WALK_MS };
    }, { passive: false });

    // ---- Game controller ----
    // D-pad (or left stick) up and down walk while held, left and right turn
    // while held (the stick turns faster the further it is pushed), LB and
    // RB step sideways, A or the right
    // trigger blows bubbles while held, and Start (or any button on the
    // start screen) starts the game or restarts it after dying. Read every
    // few milliseconds, since controllers don't send key events.
    setInterval(pollGamepad, GUY_UPDATE_INTERVAL_MS);

    function pollGamepad() {
        const pads = [...(navigator.getGamepads?.() ?? [])].filter(Boolean);
        if (pads.length === 0) {
            gamepadControls = { forward: 0, strafe: 0, turn: 0 };
            return;
        }
        const pad = pads[0];
        const isPressed = (index) => Boolean(pad.buttons[index]?.pressed);
        const stickX = pad.axes[0] ?? 0;
        const stickY = pad.axes[1] ?? 0;
        const buttons = {
            up: isPressed(GAMEPAD_BUTTON.up) || stickY < -GAMEPAD_STICK_THRESHOLD,
            down: isPressed(GAMEPAD_BUTTON.down) || stickY > GAMEPAD_STICK_THRESHOLD,
            left: isPressed(GAMEPAD_BUTTON.left) || stickX < -GAMEPAD_STICK_THRESHOLD,
            right: isPressed(GAMEPAD_BUTTON.right) || stickX > GAMEPAD_STICK_THRESHOLD,
            stepLeft: isPressed(GAMEPAD_BUTTON.stepLeft),
            stepRight: isPressed(GAMEPAD_BUTTON.stepRight),
            fire: isPressed(GAMEPAD_BUTTON.fire) || isPressed(GAMEPAD_BUTTON.fireTrigger),
            start: isPressed(GAMEPAD_BUTTON.start),
        };
        const wasDown = previousGamepadButtons;
        const isNewPress = (name) => buttons[name] && !wasDown[name];
        previousGamepadButtons = buttons;

        if (Object.values(buttons).some(Boolean)) {
            lastInputKind = "gamepad";
        }
        if (!hasStarted) {
            if (Object.keys(buttons).some(isNewPress)) {
                beginPlaying();
            }
            return;
        }
        if (isDead || isLevelComplete) {
            if (isNewPress("start") || isNewPress("fire")) {
                continueAfterPause();
            }
            return;
        }

        if (buttons.fire) {
            shoot(performance.now());
        }
        let turn = Number(isPressed(GAMEPAD_BUTTON.right)) - Number(isPressed(GAMEPAD_BUTTON.left));
        if (turn === 0 && Math.abs(stickX) > GAMEPAD_STICK_DEADZONE) {
            turn = stickX;
        }
        gamepadControls = {
            forward: Number(buttons.up) - Number(buttons.down),
            strafe: Number(buttons.stepRight) - Number(buttons.stepLeft),
            turn,
        };
    }

    function beginPlaying() {
        if (hasStarted) {
            return;
        }
        hasStarted = true;
        heldKeys = new Set();
        startGame();
    }

    function startGame() {
        level = 1;
        score = 0;
        levelStartScore = 0;
        livesLeft = LIVES_PER_GAME;
        startLevel();
    }

    // Nothing moves on the start screen, after dying, or while the level
    // complete fireworks are showing
    function isPlayPaused() {
        return isDead || isLevelComplete || !hasStarted;
    }

    // Space, a tap, A or Start on the death or level complete screen: on to
    // the next level, the same level again with the score it began with, or
    // a new game once the last life is gone. The level complete screen
    // ignores presses for its first LEVEL_COMPLETE_MIN_MS, so the win
    // can't be skipped by accident.
    function continueAfterPause() {
        if (isLevelComplete) {
            if (performance.now() - levelCompleteMs < LEVEL_COMPLETE_MIN_MS) {
                return;
            }
            level++;
            levelStartScore = score;
            startLevel();
            return;
        }
        if (livesLeft > 0) {
            score = levelStartScore;
            startLevel();
            return;
        }
        startGame();
    }

    // Builds a fresh maze for the current level and restarts the enemy clock
    // so the enemies' first step is a full interval in
    function startLevel() {
        isDead = false;
        isLevelComplete = false;
        heldKeys = new Set();
        const layout = getLevelLayout(level);
        worldCols = layout.cols;
        worldRows = layout.rows;
        tunnelRow = Math.floor(worldRows / 2);
        guyStartSquare = [Math.floor(worldCols / 2), worldRows - 2];
        maze = createMaze(layout);
        touchSwipeWalk = { forward: 0, untilMs: -Infinity };
        touchTurnRadians = 0;

        levelStartMs = performance.now();
        lastEnemyUpdateMs = levelStartMs;
        clearInterval(enemyTimerId);
        enemyTimerId = setInterval(stepEnemies, GUY_UPDATE_INTERVAL_MS);
    }

    // A new maze for the current level: walls, dots, power pellets, and
    // the guy and enemyCount enemies at their start squares
    function createMaze({ enemyCount, straightness, extraGapChance }) {
        const walls = buildValidWalls(guyStartSquare, straightness, extraGapChance);
        const dotRuns = placeDotRuns(walls, guyStartSquare);
        const { dots, powerPellets } = placePowerPellets(walls, dotRuns, guyStartSquare);
        const enemies = getEnemyStartSquares(walls, guyStartSquare, enemyCount);
        const startAngle = getLongestCorridorAngle(walls, guyStartSquare);

        return {
            walls,
            dots,
            powerPellets,
            guy: {
                x: guyStartSquare[0] + 0.5,
                y: guyStartSquare[1] + 0.5,
                squareX: guyStartSquare[0],
                squareY: guyStartSquare[1],
                angle: startAngle,
                walkDistance: 0,
                lastWalkMs: -Infinity,
                turnStartMs: null,
            },
            enemies,
            enemyFromSquares: enemies,
            enemyPositions: enemies.map(([x, y]) => ({ x: x + 0.5, y: y + 0.5 })),
            enemyHeadings: enemies.map(([x, y]) => Math.atan2(guyStartSquare[1] - y, getWrappedDeltaX(x, guyStartSquare[0]))),
            flashes: [],
            frightenedUntilMs: -Infinity,
            frightenedEnemyIndexes: new Set(),
            returningEnemyCorners: new Map(),
            returningEnemyUntilMs: new Map(),
            bullets: [],
            wallLooks: new Map(),
            startingDotCount: dots.size + powerPellets.size,
        };
    }

    // The facing, as an angle along the grid, that looks down the longest
    // straight run of open squares from the given square
    function getLongestCorridorAngle(walls, [squareX, squareY]) {
        let bestAngle = 0;
        let bestLength = -1;
        for (const [dx, dy] of STEP_DIRECTIONS) {
            let [x, y] = [squareX, squareY];
            let length = 0;
            let next = getStepDestination(walls, x, y, dx, dy);
            while (next !== null && length < worldCols + worldRows) {
                [x, y] = next;
                length++;
                next = getStepDestination(walls, x, y, dx, dy);
            }
            if (length > bestLength) {
                bestLength = length;
                bestAngle = Math.atan2(dy, dx);
            }
        }
        return bestAngle;
    }

    // The guy's clock. He turns and walks by however long it has been since
    // the last tick, then eats whatever is in the square he is in. Then
    // any enemy that has reached him is sorted out. Clearing the last dot
    // and pellet finishes the level and sets off the fireworks.
    function stepGuy() {
        const nowMs = performance.now();
        const elapsedMs = Math.min(nowMs - lastGuyUpdateMs, GUY_MAX_TICK_MS);
        lastGuyUpdateMs = nowMs;
        if (isPlayPaused()) {
            touchTurnRadians = 0;
            return;
        }

        const controls = getControls(nowMs);
        const turnedGuy = turnGuy(maze.guy, controls.turn, elapsedMs, nowMs);
        const movedGuy = walkGuy(maze.walls, turnedGuy, controls, elapsedMs, nowMs);
        touchTurnRadians = 0;

        const meal = eatAtGuy({ ...maze, guy: movedGuy }, nowMs);
        const current = meal.maze;
        score += meal.points;
        if (current.dots.size === 0 && current.powerPellets.size === 0) {
            maze = current;
            isLevelComplete = true;
            levelCompleteMs = nowMs;
            heldKeys = new Set();
            isTouchHolding = false;
            return;
        }

        const collision = resolveCollisions(current, nowMs);
        maze = collision.maze;
        score += collision.points;
        if (collision.isCaught) {
            dieToEnemy(collision.catcherIndex, nowMs);
        }
    }

    // The guy turned by a held turn control (1 full speed right, -1 full
    // speed left, or anything between) for elapsedMs, plus any finger
    // slide. Held turning eases up to full speed over GUY_TURN_RAMP_MS.
    function turnGuy(guy, turn, elapsedMs, nowMs) {
        if (turn === 0) {
            return { ...guy, angle: guy.angle + touchTurnRadians, turnStartMs: null };
        }
        const turnStartMs = guy.turnStartMs ?? nowMs;
        const ramp = clamp((nowMs - turnStartMs) / GUY_TURN_RAMP_MS, 0.25, 1);
        const angle = guy.angle + touchTurnRadians + turn * ramp * GUY_TURN_RADIANS_PER_MS * elapsedMs;
        return { ...guy, angle, turnStartMs };
    }

    // The guy walked for elapsedMs by the forward/back and sideways
    // controls, at a steady speed whichever way he goes. Each way across
    // the maze is tried on its own, so walking into a wall at a slant
    // slides him along it. Brushing the corner of a wall beside an opening
    // eases him across into the middle of the opening, so he slips into
    // side passages without having to line up exactly.
    function walkGuy(walls, guy, { forward, strafe }, elapsedMs, nowMs) {
        const length = Math.hypot(forward, strafe);
        if (length === 0) {
            return guy;
        }
        const reach = (GUY_WALK_SQUARES_PER_MS * elapsedMs) / Math.max(1, length);
        const dirX = Math.cos(guy.angle);
        const dirY = Math.sin(guy.angle);
        const moveX = (dirX * forward - dirY * strafe) * reach;
        const moveY = (dirY * forward + dirX * strafe) * reach;

        let { x, y } = guy;
        [x, y] = slideGuyAlong(walls, x, y, moveX, true);
        [y, x] = slideGuyAlong(walls, y, x, moveY, false);
        x = (x + worldCols) % worldCols;

        const walked = Math.hypot(getWrappedDeltaX(guy.x, x), y - guy.y);
        if (walked === 0) {
            return guy;
        }
        return {
            ...guy,
            x,
            y,
            squareX: Math.floor(x),
            squareY: Math.floor(y),
            walkDistance: guy.walkDistance + walked,
            lastWalkMs: nowMs,
        };
    }

    // One way across the maze of the guy's walk: moves `along` by `move`
    // if he fits there, where `across` is his place the other way and
    // isAlongX says whether `along` is x. If a wall corner is in the way
    // but the lane through the middle of his square is open, he is eased
    // across toward that lane instead. Returns [along, across].
    function slideGuyAlong(walls, along, across, move, isAlongX) {
        if (move === 0) {
            return [along, across];
        }
        const fits = (a, c) => (isAlongX ? canGuyStand(walls, a, c) : canGuyStand(walls, c, a));
        if (fits(along + move, across)) {
            return [along + move, across];
        }
        const lane = Math.floor(across) + 0.5;
        if (lane === across || !fits(along + move, lane)) {
            return [along, across];
        }
        const ease = Math.min(Math.abs(move), Math.abs(lane - across)) * Math.sign(lane - across);
        if (!fits(along, across + ease)) {
            return [along, across];
        }
        return [along, across + ease];
    }

    // Whether the guy's body fits with his middle at (x, y): none of the
    // squares his body reaches into is a wall
    function canGuyStand(walls, x, y) {
        const reach = GUY_RADIUS_SQUARES;
        return [[-reach, -reach], [reach, -reach], [-reach, reach], [reach, reach]]
            .every(([dx, dy]) => !isWallAt(walls, Math.floor(x + dx), Math.floor(y + dy)));
    }

    // Where the guy is right now, in squares
    function getGuyPosition(guy) {
        return { x: guy.x, y: guy.y };
    }

    // How many squares the guy has walked this level, or null if he has
    // stood still a moment; this drives his head bob and the sway of his gun
    function getGuyWalkDistance(guy, nowMs) {
        if (nowMs > guy.lastWalkMs + WALK_BOB_LINGER_MS) {
            return null;
        }
        return guy.walkDistance;
    }

    // How the held keys add up: forward (+1) or back (-1), step right (+1)
    // or left (-1), and turn right (+1) or left (-1)
    function getControls(nowMs) {
        const controls = { forward: 0, strafe: 0, turn: 0 };
        for (const key of heldKeys) {
            for (const [control, amount] of Object.entries(MOVE_KEYS[key])) {
                controls[control] = clamp(controls[control] + amount, -1, 1);
            }
        }
        // On a phone, a hold walks him forward, and a swipe up or down walks
        // him a little way
        let touchForward = 0;
        if (nowMs < touchSwipeWalk.untilMs) {
            touchForward = touchSwipeWalk.forward;
        }
        if (isTouchHolding) {
            touchForward = 1;
        }
        return {
            forward: clamp(controls.forward + gamepadControls.forward + touchForward, -1, 1),
            strafe: clamp(controls.strafe + gamepadControls.strafe, -1, 1),
            turn: clamp(controls.turn + gamepadControls.turn, -1, 1),
        };
    }

    // True if the square is a wall. Above and below the maze counts as wall;
    // left and right wrap round, as through the tunnel.
    function isWallAt(walls, squareX, squareY) {
        if (squareY < 0 || squareY >= worldRows) {
            return true;
        }
        const wrappedX = ((squareX % worldCols) + worldCols) % worldCols;
        return walls.has(wallKey(wrappedX, squareY));
    }

    // The shortest way from x1 to x2 across the maze, allowing for the
    // tunnel joining the left and right edges
    function getWrappedDeltaX(x1, x2) {
        let delta = x2 - x1;
        if (delta > worldCols / 2) {
            delta -= worldCols;
        }
        if (delta < -worldCols / 2) {
            delta += worldCols;
        }
        return delta;
    }

    function getDistanceSquares(x1, y1, x2, y2) {
        return Math.hypot(getWrappedDeltaX(x1, x2), y2 - y1);
    }

    function stepEnemies() {
        const nowMs = performance.now();
        const elapsedMs = Math.min(nowMs - lastEnemyUpdateMs, GUY_MAX_TICK_MS);
        lastEnemyUpdateMs = nowMs;
        if (isPlayPaused() || nowMs - levelStartMs < getEnemyStepIntervalMs()) {
            return;
        }
        const collision = resolveCollisions(moveEnemies(maze, elapsedMs, nowMs), nowMs);
        maze = collision.maze;
        score += collision.points;
        if (collision.isCaught) {
            dieToEnemy(collision.catcherIndex, nowMs);
        }
    }

    // Set by the level's layout, then faster every level after the last one
    function getEnemyStepIntervalMs() {
        const speedups = Math.max(0, level - LEVEL_LAYOUTS.length);
        return getLevelLayout(level).enemyStepMs / ENEMY_SPEEDUP_PER_LEVEL ** speedups;
    }

    // The maze size and enemy count for a level; past the end of the list,
    // its last entry
    function getLevelLayout(levelNumber) {
        return LEVEL_LAYOUTS[Math.min(levelNumber, LEVEL_LAYOUTS.length) - 1];
    }

    // Sizes the canvas to the window in real screen pixels (so it stays sharp
    // on high-density screens) and works out how to fit the game into it
    function resizeCanvas() {
        const pixelRatio = window.devicePixelRatio || 1;
        canvas.width = Math.round(window.innerWidth * pixelRatio);
        canvas.height = Math.round(window.innerHeight * pixelRatio);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;

        const scale = Math.min(canvas.width / GAME_W, canvas.height / GAME_H);
        gameTransform = {
            scale,
            offsetX: (canvas.width - GAME_W * scale) / 2,
            offsetY: (canvas.height - GAME_H * scale) / 2,
        };
    }

    function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
    }

    function wallKey(squareX, squareY) {
        return `${squareX},${squareY}`;
    }

    // The square the guy is in, or stepping into; enemies chase this square
    function getGuySquare(currentMaze) {
        return [currentMaze.guy.squareX, currentMaze.guy.squareY];
    }

    // ---- Shooting ----

    // Blows a bubble straight the way the guy faces, unless he shot too
    // recently. It starts a little in front of him, so it doesn't fill the
    // whole view in its first moment.
    function shoot(nowMs) {
        if (nowMs - lastShotMs < SHOT_COOLDOWN_MS) {
            return;
        }
        lastShotMs = nowMs;
        const { x, y } = getGuyPosition(maze.guy);
        const faceX = Math.cos(maze.guy.angle);
        const faceY = Math.sin(maze.guy.angle);
        const bullet = {
            x: (x + faceX * BUBBLE_START_AHEAD_SQUARES + worldCols) % worldCols,
            y: y + faceY * BUBBLE_START_AHEAD_SQUARES,
            vx: faceX * BULLET_SPEED_SQUARES_PER_MS,
            vy: faceY * BULLET_SPEED_SQUARES_PER_MS,
            lastMs: nowMs,
            bornMs: nowMs,
        };
        maze = { ...maze, bullets: [...maze.bullets, bullet] };
    }

    // Bullets fly smoothly, so they move on their own fast clock rather than
    // the enemy one; they stop where they are once play stops
    function stepBullets() {
        if (isDead || isLevelComplete) {
            return;
        }
        const flight = moveBullets(maze, performance.now());
        maze = flight.maze;
        score += flight.points;
    }

    // Moves every bullet to where it is now, in small steps so it can't
    // skip past a wall or an enemy. A bullet is gone once it hits a wall or
    // an enemy; a hit enemy scores and starts walking back to the corner
    // farthest from the guy.
    function moveBullets(currentMaze, nowMs) {
        let updated = currentMaze;
        let points = 0;
        const remainingBullets = [];
        const flashes = currentMaze.flashes.filter(({ startMs }) => nowMs - startMs < BUBBLE_FLASH_MS);

        for (const bullet of currentMaze.bullets) {
            const elapsedMs = nowMs - bullet.lastMs;
            const stepCount = Math.max(1, Math.ceil((elapsedMs * BULLET_SPEED_SQUARES_PER_MS) / 0.1));
            const stepMs = elapsedMs / stepCount;
            let x = bullet.x;
            let y = bullet.y;
            let isGone = false;

            for (let step = 0; step < stepCount && !isGone; step++) {
                const [lastX, lastY] = [x, y];
                x = (x + bullet.vx * stepMs + worldCols) % worldCols;
                y += bullet.vy * stepMs;
                if (isWallAt(updated.walls, Math.floor(x), Math.floor(y))) {
                    updated = recolorShotWall(updated, wallKey(Math.floor(x), Math.floor(y)), nowMs);
                    flashes.push({ x: lastX, y: lastY, startMs: nowMs });
                    isGone = true;
                    continue;
                }

                const hitIndex = getEnemyCenters(updated).findIndex(({ x: enemyX, y: enemyY }, i) => (
                    !updated.returningEnemyCorners.has(i)
                    && getDistanceSquares(x, y, enemyX, enemyY) < BULLET_HIT_RADIUS_SQUARES
                ));
                if (hitIndex !== -1) {
                    points += SHOT_ENEMY_POINTS;
                    updated = sendEnemyHome(updated, hitIndex, nowMs);
                    flashes.push({ x, y, startMs: nowMs });
                    isGone = true;
                }
            }

            if (!isGone) {
                remainingBullets.push({ ...bullet, x, y, lastMs: nowMs });
            }
        }

        return { maze: { ...updated, bullets: remainingBullets, flashes }, points };
    }

    // A bubble bursts on a wall: the wall's rain heads on to the next
    // colour in MATRIX_PALETTE_RGBS, carrying on smoothly from wherever its
    // colour is now. A wall already changing can have at most one more
    // colour queued, so rapid fire never makes it race.
    function recolorShotWall(currentMaze, hitWallKey, nowMs) {
        const look = currentMaze.wallLooks.get(hitWallKey) ?? { position: 0, target: 0, updatedMs: nowMs };
        const position = getWallLookPosition(look, nowMs);
        const target = Math.min(look.target + 1, Math.floor(position) + 2);
        return {
            ...currentMaze,
            wallLooks: new Map([...currentMaze.wallLooks, [hitWallKey, { position, target, updatedMs: nowMs }]]),
        };
    }

    // How far through MATRIX_PALETTE_RGBS a wall's colour is at nowMs (2.5
    // is half way from the third colour to the fourth), moving towards its
    // target at one colour per WALL_LOOK_CHANGE_MS
    function getWallLookPosition({ position, target, updatedMs }, nowMs) {
        return Math.min(target, position + (nowMs - updatedMs) / WALL_LOOK_CHANGE_MS);
    }

    // ---- Eating and catching ----

    // The guy eats the dot or power pellet on his square. A power pellet
    // frightens every enemy except ones already walking back.
    function eatAtGuy(currentMaze, nowMs) {
        const guyKey = wallKey(...getGuySquare(currentMaze));
        let updated = currentMaze;
        let points = 0;

        if (currentMaze.dots.has(guyKey)) {
            points += POINTS_PER_DOT;
            updated = { ...updated, dots: new Set([...currentMaze.dots].filter((key) => key !== guyKey)) };
        }
        if (currentMaze.powerPellets.has(guyKey)) {
            points += POWER_PELLET_POINTS;
            updated = {
                ...updated,
                powerPellets: new Set([...currentMaze.powerPellets].filter((key) => key !== guyKey)),
                frightenedUntilMs: nowMs + FRIGHTENED_DURATION_MS,
                frightenedEnemyIndexes: new Set(
                    [...currentMaze.enemies.keys()].filter((i) => !currentMaze.returningEnemyCorners.has(i))
                ),
            };
        }

        return { maze: updated, points };
    }

    // Deals with any enemy that has reached the guy, judged by where it is
    // drawn so a catch happens when it visibly reaches him. A frightened one
    // is eaten: the guy scores and it starts walking back. Enemies already
    // walking back are harmless. Any other enemy catches him.
    function resolveCollisions(currentMaze, nowMs) {
        const { x: guyX, y: guyY } = getGuyPosition(currentMaze.guy);
        let updated = currentMaze;
        let points = 0;

        const centers = getEnemyCenters(currentMaze);
        for (let i = 0; i < centers.length; i++) {
            const isTouching = getDistanceSquares(guyX, guyY, centers[i].x, centers[i].y) < CATCH_DISTANCE_SQUARES;
            if (!isTouching || updated.returningEnemyCorners.has(i)) {
                continue;
            }
            if (isEnemyFrightened(updated, i, nowMs)) {
                points += EATEN_ENEMY_POINTS;
                updated = sendEnemyHome(updated, i, nowMs);
                continue;
            }
            return { maze: updated, points, isCaught: true, catcherIndex: i };
        }

        return { maze: updated, points, isCaught: false, catcherIndex: null };
    }

    // The guy is caught: he loses a life, the game stops, and the screen
    // will flood with the colour of the enemy that got him
    function dieToEnemy(catcherIndex, nowMs) {
        isDead = true;
        livesLeft--;
        heldKeys = new Set();
        isTouchHolding = false;
        deathColor = ENEMY_BODY_COLORS[catcherIndex % ENEMY_BODY_COLORS.length];
        deathMs = nowMs;
    }

    // The maze with this enemy no longer frightened and walking back to
    // the corner farthest from the guy, staying a ghost for at least
    // RETURNING_ENEMY_MIN_MS. It backs straight off first, so it never
    // carries on into him.
    function sendEnemyHome(currentMaze, enemyIndex, nowMs) {
        const backedOff = backEnemyAway(currentMaze, enemyIndex);
        return {
            ...backedOff,
            frightenedEnemyIndexes: new Set([...currentMaze.frightenedEnemyIndexes].filter((i) => i !== enemyIndex)),
            returningEnemyCorners: new Map([
                ...currentMaze.returningEnemyCorners,
                [enemyIndex, getFarthestFreeCorner(backedOff, enemyIndex)],
            ]),
            returningEnemyUntilMs: new Map([
                ...currentMaze.returningEnemyUntilMs,
                [enemyIndex, nowMs + RETURNING_ENEMY_MIN_MS],
            ]),
        };
    }

    function isEnemyFrightened(currentMaze, index, nowMs) {
        return nowMs < currentMaze.frightenedUntilMs && currentMaze.frightenedEnemyIndexes.has(index);
    }

    // The enemy, if it was heading for a square closer to the guy, turned
    // round to head back to the square it came from instead, unless that
    // is where the guy is
    function backEnemyAway(currentMaze, enemyIndex) {
        const [fromX, fromY] = currentMaze.enemyFromSquares[enemyIndex];
        const [toX, toY] = currentMaze.enemies[enemyIndex];
        const [guySqX, guySqY] = getGuySquare(currentMaze);
        const distancesFromGuy = getPathDistances(currentMaze.walls, guySqX, guySqY);
        const isComingCloser = distancesFromGuy.get(wallKey(toX, toY)) < distancesFromGuy.get(wallKey(fromX, fromY));
        const isFromGuy = fromX === guySqX && fromY === guySqY;
        if (!isComingCloser || isFromGuy) {
            return currentMaze;
        }
        return {
            ...currentMaze,
            enemies: currentMaze.enemies.map((square, i) => (i === enemyIndex ? [fromX, fromY] : square)),
            enemyFromSquares: currentMaze.enemyFromSquares.map((square, i) => (i === enemyIndex ? [toX, toY] : square)),
        };
    }

    // The maze corner farthest from the guy by walking distance that no
    // other enemy is standing on or heading back to, preferring corners
    // the enemy can reach without passing through the guy
    function getFarthestFreeCorner(currentMaze, enemyIndex) {
        const [guySqX, guySqY] = getGuySquare(currentMaze);
        const distances = getPathDistances(currentMaze.walls, guySqX, guySqY);
        const [enemySqX, enemySqY] = currentMaze.enemies[enemyIndex];
        const reachable = getPathDistances(getWallsAvoiding(currentMaze.walls, [wallKey(guySqX, guySqY)], enemySqX, enemySqY), enemySqX, enemySqY);
        const otherEnemyKeys = new Set([
            ...currentMaze.enemies.filter((_, index) => index !== enemyIndex).map(([x, y]) => wallKey(x, y)),
            ...[...currentMaze.returningEnemyCorners.values()].map(([x, y]) => wallKey(x, y)),
        ]);
        const corners = [
            [1, 1],
            [worldCols - 2, 1],
            [1, worldRows - 2],
            [worldCols - 2, worldRows - 2],
        ];
        const freeCorners = corners
            .filter(([x, y]) => !otherEnemyKeys.has(wallKey(x, y)))
            .sort((a, b) => distances.get(wallKey(b[0], b[1])) - distances.get(wallKey(a[0], a[1])));
        return freeCorners.find(([x, y]) => reachable.has(wallKey(x, y))) ?? freeCorners[0];
    }

    // The next square for an enemy walking back to its corner. It goes
    // round the guy rather than through him: it keeps off his square and,
    // where there is another way, the squares beside him. If he blocks the
    // only way, it waits.
    function getReturnStep(currentMaze, [enemySqX, enemySqY], [cornerX, cornerY]) {
        const [guySqX, guySqY] = getGuySquare(currentMaze);
        const guyKey = wallKey(guySqX, guySqY);
        const besideGuyKeys = STEP_DIRECTIONS
            .map(([dx, dy]) => getStepDestination(currentMaze.walls, guySqX, guySqY, dx, dy))
            .filter((square) => square !== null)
            .map(([x, y]) => wallKey(x, y));
        for (const avoidedKeys of [[guyKey, ...besideGuyKeys], [guyKey]]) {
            const walls = getWallsAvoiding(currentMaze.walls, avoidedKeys, enemySqX, enemySqY);
            const distances = getPathDistances(walls, cornerX, cornerY);
            if (distances.has(wallKey(enemySqX, enemySqY))) {
                return getStepToward(walls, enemySqX, enemySqY, distances, new Set());
            }
        }
        return [enemySqX, enemySqY];
    }

    // The walls with these squares walled off too, except the enemy's own
    // square, so paths can be found that keep away from them
    function getWallsAvoiding(walls, avoidedKeys, enemySqX, enemySqY) {
        const enemyKey = wallKey(enemySqX, enemySqY);
        return new Set([...walls, ...avoidedKeys.filter((key) => key !== enemyKey)]);
    }

    // ---- Enemy movement ----

    // The maze after elapsedMs of enemy movement. Each enemy glides toward
    // the middle of the square it is heading for, at one square per enemy
    // step interval, or RETURNING_ENEMY_SPEEDUP times that while walking
    // back to a corner. Once it is within ENEMY_CORNER_CUT_SQUARES of that
    // middle it picks its next square and curves off toward it, so it
    // rounds corners instead of stopping square by square. A chasing enemy
    // in the guy's own square goes straight for him. Each enemy faces the
    // way it is moving.
    function moveEnemies(currentMaze, elapsedMs, nowMs) {
        const [guySqX, guySqY] = getGuySquare(currentMaze);
        const guyPosition = getGuyPosition(currentMaze.guy);
        const distancesFromGuy = getPathDistances(currentMaze.walls, guySqX, guySqY);
        const walkSpeed = 1 / getEnemyStepIntervalMs();
        let updated = currentMaze;

        for (let i = 0; i < currentMaze.enemies.length; i++) {
            const isReturning = currentMaze.returningEnemyCorners.has(i);
            let reach = walkSpeed * elapsedMs;
            if (isReturning) {
                reach *= RETURNING_ENEMY_SPEEDUP;
            }
            const position = updated.enemyPositions[i];
            let [toX, toY] = updated.enemies[i];
            let fromSquare = updated.enemyFromSquares[i];
            const centerDistance = getDistanceSquares(position.x, position.y, toX + 0.5, toY + 0.5);
            if (centerDistance <= Math.max(reach, ENEMY_CORNER_CUT_SQUARES)) {
                const [nextX, nextY] = getNextEnemySquare(updated, i, distancesFromGuy, nowMs);
                if (nextX !== toX || nextY !== toY) {
                    fromSquare = [toX, toY];
                    [toX, toY] = [nextX, nextY];
                }
            }

            let target = { x: toX + 0.5, y: toY + 0.5 };
            const isChasing = !isReturning && !isEnemyFrightened(currentMaze, i, nowMs);
            if (isChasing && toX === guySqX && toY === guySqY) {
                target = guyPosition;
            }
            const dx = getWrappedDeltaX(position.x, target.x);
            const dy = target.y - position.y;
            const targetDistance = Math.hypot(dx, dy);
            const moved = Math.min(reach, targetDistance);
            let movedPosition = position;
            let heading = updated.enemyHeadings[i];
            if (moved > 0) {
                movedPosition = {
                    x: (position.x + (dx / targetDistance) * moved + worldCols) % worldCols,
                    y: position.y + (dy / targetDistance) * moved,
                };
                heading = Math.atan2(dy, dx);
            }

            updated = {
                ...updated,
                enemies: updated.enemies.map((square, j) => (j === i ? [toX, toY] : square)),
                enemyFromSquares: updated.enemyFromSquares.map((square, j) => (j === i ? fromSquare : square)),
                enemyPositions: updated.enemyPositions.map((place, j) => (j === i ? movedPosition : place)),
                enemyHeadings: updated.enemyHeadings.map((angle, j) => (j === i ? heading : angle)),
            };
        }

        // Returning enemies that have reached the middle of their corner,
        // and been ghosts long enough, are back to normal; until then they
        // wait there
        const returningEnemyCorners = new Map([...updated.returningEnemyCorners].filter(([i, [cornerX, cornerY]]) => {
            const { x, y } = updated.enemyPositions[i];
            const isHome = getDistanceSquares(x, y, cornerX + 0.5, cornerY + 0.5) < 0.05;
            return !isHome || nowMs < updated.returningEnemyUntilMs.get(i);
        }));
        const returningEnemyUntilMs = new Map([...updated.returningEnemyUntilMs]
            .filter(([i]) => returningEnemyCorners.has(i)));

        return { ...updated, returningEnemyCorners, returningEnemyUntilMs };
    }

    // The square this enemy should head for next from the one it is
    // reaching: round the guy to its corner while returning, a random open
    // neighbour while frightened, or else one step along the shortest path
    // toward the guy. Chasing and frightened enemies never pick a square
    // another of them is in or heading for; with nowhere to go, an enemy
    // stays where it is.
    function getNextEnemySquare(currentMaze, index, distancesFromGuy, nowMs) {
        const [squareX, squareY] = currentMaze.enemies[index];
        const corner = currentMaze.returningEnemyCorners.get(index);
        if (corner !== undefined) {
            return getReturnStep(currentMaze, [squareX, squareY], corner);
        }

        const occupiedKeys = new Set([...currentMaze.enemies.keys()]
            .filter((j) => j !== index && !currentMaze.returningEnemyCorners.has(j))
            .flatMap((j) => {
                const { x, y } = currentMaze.enemyPositions[j];
                return [wallKey(...currentMaze.enemies[j]), wallKey(Math.floor(x), Math.floor(y))];
            }));

        if (isEnemyFrightened(currentMaze, index, nowMs)) {
            const freeSteps = STEP_DIRECTIONS
                .map(([dx, dy]) => getStepDestination(currentMaze.walls, squareX, squareY, dx, dy))
                .filter((next) => next !== null && !occupiedKeys.has(wallKey(next[0], next[1])));
            if (freeSteps.length === 0) {
                return [squareX, squareY];
            }
            return freeSteps[Math.floor(Math.random() * freeSteps.length)];
        }

        return getStepToward(currentMaze.walls, squareX, squareY, distancesFromGuy, occupiedKeys);
    }

    // The neighbouring square that is closest by the given walking
    // distances, if it is closer than where the enemy is now and not in
    // occupiedKeys; otherwise the enemy stays put
    function getStepToward(walls, x, y, distances, occupiedKeys) {
        let bestDistance = distances.get(wallKey(x, y));
        let bestStep = [x, y];
        for (const [dx, dy] of STEP_DIRECTIONS) {
            const next = getStepDestination(walls, x, y, dx, dy);
            if (next === null) {
                continue;
            }
            const key = wallKey(next[0], next[1]);
            const distance = distances.get(key);
            if (distance < bestDistance && !occupiedKeys.has(key)) {
                bestDistance = distance;
                bestStep = next;
            }
        }
        return bestStep;
    }

    // Middle of each enemy, as { x, y } in squares
    function getEnemyCenters(currentMaze) {
        return currentMaze.enemyPositions;
    }

    // ---- Paths ----

    // The open square one step from (x, y) in direction (dx, dy), or null
    // if a wall or the top/bottom edge is in the way. Stepping off the left
    // or right edge comes back in on the other side.
    function getStepDestination(walls, x, y, dx, dy) {
        const nextX = (x + dx + worldCols) % worldCols;
        const nextY = y + dy;
        if (nextY < 0 || nextY >= worldRows || walls.has(wallKey(nextX, nextY))) {
            return null;
        }
        return [nextX, nextY];
    }

    // Walking distance from the given square to every square reachable
    // from it, as a Map of "x,y" -> number of steps
    function getPathDistances(walls, fromSqX, fromSqY) {
        const distances = new Map([[wallKey(fromSqX, fromSqY), 0]]);
        const queue = [[fromSqX, fromSqY]];

        for (let i = 0; i < queue.length; i++) {
            const [x, y] = queue[i];
            const distance = distances.get(wallKey(x, y));

            for (const [dx, dy] of STEP_DIRECTIONS) {
                const next = getStepDestination(walls, x, y, dx, dy);
                if (next === null) {
                    continue;
                }
                const key = wallKey(next[0], next[1]);
                if (!distances.has(key)) {
                    distances.set(key, distance + 1);
                    queue.push(next);
                }
            }
        }

        return distances;
    }

    // ---- Building a maze ----

    // Walls for a new maze, retried until no open square is sealed off, no
    // corridor is a dead end and no open area is too big
    function buildValidWalls(guySquare, straightness, extraGapChance) {
        let walls = generateMazeWalls(guySquare, straightness, extraGapChance);
        for (let attempt = 1; attempt < MAZE_GENERATION_MAX_ATTEMPTS; attempt++) {
            const isValid = isEveryOpenSquareReachable(walls, guySquare)
                && isFreeOfDeadEnds(walls)
                && findOversizedOpenArea(walls) === null;
            if (isValid) {
                break;
            }
            walls = generateMazeWalls(guySquare, straightness, extraGapChance);
        }
        return walls;
    }

    // Builds the maze on a lattice. "Rooms" at odd (x, y) are always open,
    // "pillars" at even (x, y) are always wall, and each square between two
    // neighbouring rooms is either a wall or a gap. Corridors are therefore
    // one square wide, so no open area is bigger than 2x2. With chance
    // straightness, the carving carries on in the way it was already going,
    // giving long straight corridors and few turns.
    function generateMazeWalls([guySqX, guySqY], straightness, extraGapChance) {
        const walls = new Set();

        // Start with every non-room square walled, except the tunnel ends
        for (let x = 0; x < worldCols; x++) {
            for (let y = 0; y < worldRows; y++) {
                const isRoom = x % 2 === 1 && y % 2 === 1;
                const isTunnelEnd = y === tunnelRow && (x === 0 || x === worldCols - 1);
                if (!isRoom && !isTunnelEnd) {
                    walls.add(wallKey(x, y));
                }
            }
        }

        // Carve a random maze joining every room, starting from the guy
        const visitedRoomKeys = new Set([wallKey(guySqX, guySqY)]);
        const stack = [{ x: guySqX, y: guySqY, dx: 0, dy: 0 }];
        while (stack.length > 0) {
            const { x, y, dx, dy } = stack[stack.length - 1];
            const unvisited = getNeighbourRooms(x, y)
                .filter(([roomX, roomY]) => !visitedRoomKeys.has(wallKey(roomX, roomY)));
            if (unvisited.length === 0) {
                stack.pop();
                continue;
            }
            const straightOn = unvisited.find(([roomX, roomY]) => roomX === x + dx * 2 && roomY === y + dy * 2);
            let [nextX, nextY] = unvisited[Math.floor(Math.random() * unvisited.length)];
            if (straightOn !== undefined && Math.random() < straightness) {
                [nextX, nextY] = straightOn;
            }
            walls.delete(wallKey((x + nextX) / 2, (y + nextY) / 2));
            visitedRoomKeys.add(wallKey(nextX, nextY));
            stack.push({ x: nextX, y: nextY, dx: (nextX - x) / 2, dy: (nextY - y) / 2 });
        }

        // Give every dead-end room a second way out, then knock out a few
        // more walls at random so the maze has plenty of loops
        for (let x = 1; x < worldCols; x += 2) {
            for (let y = 1; y < worldRows; y += 2) {
                const exitCount = STEP_DIRECTIONS
                    .filter(([dx, dy]) => getStepDestination(walls, x, y, dx, dy) !== null)
                    .length;
                const gaps = getNeighbourRooms(x, y)
                    .map(([roomX, roomY]) => [(x + roomX) / 2, (y + roomY) / 2])
                    .filter(([gapX, gapY]) => walls.has(wallKey(gapX, gapY)) && canOpenWall(walls, gapX, gapY));

                let openCount = 0;
                if (exitCount < 2) {
                    openCount = 1;
                }
                for (const [gapX, gapY] of gaps) {
                    if (Math.random() < extraGapChance) {
                        openCount++;
                    }
                }

                const shuffledGaps = [...gaps].sort(() => Math.random() - 0.5);
                for (const [gapX, gapY] of shuffledGaps.slice(0, openCount)) {
                    if (canOpenWall(walls, gapX, gapY)) {
                        walls.delete(wallKey(gapX, gapY));
                    }
                }
            }
        }

        return walls;
    }

    // Rooms two squares away in each direction that are inside the border
    function getNeighbourRooms(x, y) {
        return STEP_DIRECTIONS
            .map(([dx, dy]) => [x + dx * 2, y + dy * 2])
            .filter(([roomX, roomY]) => roomX > 0 && roomY > 0
                && roomX < worldCols - 1 && roomY < worldRows - 1);
    }

    // True if removing this wall leaves every wall beside it still touching
    // another wall, so no wall is ever left standing on its own
    function canOpenWall(walls, x, y) {
        return STEP_DIRECTIONS.every(([dx, dy]) => {
            const neighbourX = x + dx;
            const neighbourY = y + dy;
            if (!walls.has(wallKey(neighbourX, neighbourY))) {
                return true;
            }
            return STEP_DIRECTIONS.some(([ndx, ndy]) => {
                const otherX = neighbourX + ndx;
                const otherY = neighbourY + ndy;
                const isRemovedWall = otherX === x && otherY === y;
                return !isRemovedWall && walls.has(wallKey(otherX, otherY));
            });
        });
    }

    // Top-left [x, y] of a fully open block one square bigger than allowed
    // each way, or null if the maze has none
    function findOversizedOpenArea(walls) {
        const size = OPEN_AREA_MAX_SIZE + 1;
        for (let x = 0; x + size <= worldCols; x++) {
            for (let y = 0; y + size <= worldRows; y++) {
                if (isBlockOpen(walls, x, y, size)) {
                    return [x, y];
                }
            }
        }
        return null;
    }

    function isBlockOpen(walls, left, top, size) {
        for (let x = left; x < left + size; x++) {
            for (let y = top; y < top + size; y++) {
                if (walls.has(wallKey(x, y))) {
                    return false;
                }
            }
        }
        return true;
    }

    // True if every open square has at least two ways out, so no corridor
    // ends in a pocket the guy could get trapped in
    function isFreeOfDeadEnds(walls) {
        for (let x = 0; x < worldCols; x++) {
            for (let y = 0; y < worldRows; y++) {
                if (walls.has(wallKey(x, y))) {
                    continue;
                }
                const exitCount = STEP_DIRECTIONS
                    .filter(([dx, dy]) => getStepDestination(walls, x, y, dx, dy) !== null)
                    .length;
                if (exitCount < 2) {
                    return false;
                }
            }
        }
        return true;
    }

    function isEveryOpenSquareReachable(walls, [guySqX, guySqY]) {
        const openSquareCount = worldCols * worldRows - walls.size;
        return getPathDistances(walls, guySqX, guySqY).size === openSquareCount;
    }

    // Lays dots as runs along the corridors until they cover about
    // DOT_SHARE of the open squares. The guy's square starts empty, and any
    // group of touching dots smaller than DOT_RUN_MIN_LENGTH is removed.
    function placeDotRuns(walls, [guySqX, guySqY]) {
        const guyKey = wallKey(guySqX, guySqY);
        const openKeys = [...getPathDistances(walls, guySqX, guySqY).keys()].filter((key) => key !== guyKey);
        const targetCount = Math.round(openKeys.length * DOT_SHARE);

        const dots = new Set();
        for (let attempt = 0; attempt < openKeys.length && dots.size < targetCount; attempt++) {
            const emptyKeys = openKeys.filter((key) => !dots.has(key));
            let [x, y] = emptyKeys[Math.floor(Math.random() * emptyKeys.length)].split(",").map(Number);
            let [dx, dy] = STEP_DIRECTIONS[Math.floor(Math.random() * 4)];
            const length = DOT_RUN_MIN_LENGTH
                + Math.floor(Math.random() * (DOT_RUN_MAX_LENGTH - DOT_RUN_MIN_LENGTH + 1));

            for (let step = 0; step < length; step++) {
                dots.add(wallKey(x, y));

                // Keep going straight when possible, otherwise turn into any
                // open square that has no dot yet
                const options = STEP_DIRECTIONS
                    .map(([optionDx, optionDy]) => [optionDx, optionDy, getStepDestination(walls, x, y, optionDx, optionDy)])
                    .filter(([, , next]) => next !== null
                        && !dots.has(wallKey(next[0], next[1]))
                        && wallKey(next[0], next[1]) !== guyKey);
                if (options.length === 0) {
                    break;
                }
                let chosen = options.find(([optionDx, optionDy]) => optionDx === dx && optionDy === dy);
                if (chosen === undefined || Math.random() > DOT_RUN_STRAIGHT_CHANCE) {
                    chosen = options[Math.floor(Math.random() * options.length)];
                }
                [dx, dy] = chosen;
                [x, y] = chosen[2];
            }
        }

        return removeSmallDotGroups(walls, dots);
    }

    // The dots without any group of touching dots smaller than
    // DOT_RUN_MIN_LENGTH
    function removeSmallDotGroups(walls, dots) {
        const smallGroupKeys = new Set(
            getDotGroups(walls, dots)
                .filter((group) => group.length < DOT_RUN_MIN_LENGTH)
                .flat()
        );
        return new Set([...dots].filter((key) => !smallGroupKeys.has(key)));
    }

    // Groups of dots that touch each other, as arrays of "x,y" keys
    function getDotGroups(walls, dots) {
        const seenKeys = new Set();
        const groups = [];
        for (const startKey of dots) {
            if (seenKeys.has(startKey)) {
                continue;
            }
            const group = [startKey];
            seenKeys.add(startKey);
            for (let i = 0; i < group.length; i++) {
                const [x, y] = group[i].split(",").map(Number);
                for (const [dx, dy] of STEP_DIRECTIONS) {
