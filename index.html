                    const next = getStepDestination(walls, x, y, dx, dy);
                    if (next === null) {
                        continue;
                    }
                    const key = wallKey(next[0], next[1]);
                    if (dots.has(key) && !seenKeys.has(key)) {
                        seenKeys.add(key);
                        group.push(key);
                    }
                }
            }
            groups.push(group);
        }
        return groups;
    }

    // One power pellet in each quarter of the maze, on the square in that
    // quarter nearest its middle, so the pellets are evenly spread out.
    // Squares without a dot are preferred; if a quarter has none, the
    // pellet replaces a dot and any dot group that leaves too small goes.
    // Returns the pellets and the dots that remain.
    function placePowerPellets(walls, dots, [guySqX, guySqY]) {
        const guyKey = wallKey(guySqX, guySqY);
        const openSquares = [...getPathDistances(walls, guySqX, guySqY).keys()]
            .filter((key) => key !== guyKey)
            .map((key) => key.split(",").map(Number));
        const halfCols = worldCols / 2;
        const halfRows = worldRows / 2;
        const quarters = [
            { isLeft: true, isTop: true },
            { isLeft: false, isTop: true },
            { isLeft: true, isTop: false },
            { isLeft: false, isTop: false },
        ];

        const powerPellets = new Set();
        for (const { isLeft, isTop } of quarters) {
            const inQuarter = openSquares.filter(([x, y]) => (x < halfCols) === isLeft && (y < halfRows) === isTop);
            let candidates = inQuarter.filter(([x, y]) => !dots.has(wallKey(x, y)));
            if (candidates.length === 0) {
                candidates = inQuarter;
            }

            let middleX = halfCols / 2;
            if (!isLeft) {
                middleX = halfCols * 1.5;
            }
            let middleY = halfRows / 2;
            if (!isTop) {
                middleY = halfRows * 1.5;
            }
            const [nearestX, nearestY] = candidates.reduce((best, square) => {
                const squareDistance = Math.hypot(square[0] - middleX, square[1] - middleY);
                const bestDistance = Math.hypot(best[0] - middleX, best[1] - middleY);
                if (squareDistance < bestDistance) {
                    return square;
                }
                return best;
            });
            powerPellets.add(wallKey(nearestX, nearestY));
        }

        const remainingDots = new Set([...dots].filter((key) => !powerPellets.has(key)));
        return { dots: removeSmallDotGroups(walls, remainingDots), powerPellets };
    }

    // Start squares for the given number of enemies. The first goes on the
    // square farthest from the guy; each next one goes in the far half of
    // the maze, as far as possible from the enemies already placed. A square
    // must also be far from the guy on the grid itself, not just by walking
    // around a wall, so no enemy appears right beside him.
    function getEnemyStartSquares(walls, [guySqX, guySqY], count) {
        const distancesFromGuy = getPathDistances(walls, guySqX, guySqY);
        const maxDistance = Math.max(...distancesFromGuy.values());
        const candidateKeys = [...distancesFromGuy]
            .filter(([key, distance]) => {
                const [x, y] = key.split(",").map(Number);
                const gridDistance = Math.abs(x - guySqX) + Math.abs(y - guySqY);
                // At least half the maze's height away across the grid
                return distance >= maxDistance / 2 && gridDistance >= worldRows / 2;
            })
            .map(([key]) => key);

        const starts = [];
        const distancesFromPlaced = [];
        for (let i = 0; i < count; i++) {
            let bestKey = candidateKeys[0];
            let bestScore = -1;
            for (const key of candidateKeys) {
                let spreadScore = distancesFromGuy.get(key);
                for (const distances of distancesFromPlaced) {
                    spreadScore = Math.min(spreadScore, distances.get(key));
                }
                if (spreadScore > bestScore) {
                    bestKey = key;
                    bestScore = spreadScore;
                }
            }

            const [x, y] = bestKey.split(",").map(Number);
            starts.push([x, y]);
            distancesFromPlaced.push(getPathDistances(walls, x, y));
        }

        return starts;
    }

    // ---- Drawing: first-person view ----

    function renderFrame() {
        draw(performance.now());
        requestAnimationFrame(renderFrame);
    }

    function draw(nowMs) {
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Everything below is drawn in game coordinates, scaled and centred
        const { scale, offsetX, offsetY } = gameTransform;
        ctx.setTransform(scale, 0, 0, scale, offsetX, offsetY);

        // Keep the game inside its own area, so nothing spills into the borders
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, GAME_W, GAME_H);
        ctx.clip();

        // The world itself shakes with the camera; the blaster and
        // everything drawn over the view stay steady
        const camera = getCamera(maze, nowMs);
        const lights = getLights(maze, nowMs);
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, VIEW_W, VIEW_H);
        ctx.clip();
        ctx.translate(VIEW_W / 2 + camera.shakeX, VIEW_H / 2 + camera.shakeY);
        ctx.scale(CAMERA_OVERSCAN_SCALE, CAMERA_OVERSCAN_SCALE);
        ctx.translate(-VIEW_W / 2, -VIEW_H / 2);
        drawCeilingAndFloor(camera, lights);
        const wallDepths = drawWalls(maze, camera, lights, nowMs);
        drawWorldObjects(maze, camera, wallDepths, nowMs);
        ctx.restore();
        drawBubbleBlaster(maze, camera, nowMs);
        drawCrosshair();
        drawGuideArrows(maze, camera, nowMs);
        drawMinimap(maze, camera, nowMs);
        drawStatusBar(nowMs);

        if (isDead) {
            drawDeathMessage(nowMs);
        }
        if (isLevelComplete) {
            drawLevelComplete(nowMs);
        }
        if (!hasStarted) {
            drawStartScreen(nowMs);
        }

        ctx.restore();
    }

    // Where the guy's eye is and which way it looks, as used for every ray:
    // direction is his facing, plane points to his right and is as long as
    // the half-width of the view one square ahead. horizonY is the screen
    // row of eye level, bobbing as he walks and dipping as he stops.
    // shakeX/shakeY jolt the view while a bug is close.
    function getCamera(currentMaze, nowMs) {
        const { x, y } = getGuyPosition(currentMaze.guy);
        const { angle } = currentMaze.guy;
        const planeLength = Math.tan(FIELD_OF_VIEW_RADIANS / 2);

        let bob = 0;
        const walkDistance = getGuyWalkDistance(currentMaze.guy, nowMs);
        if (walkDistance !== null) {
            bob = HEAD_BOB_PX * Math.sin(walkDistance * HEAD_BOB_PER_SQUARE * Math.PI);
        }

        // Stopping: the walk ended a couple of ticks ago, so the view nods
        // down and back up once
        const stoppedShare = (nowMs - currentMaze.guy.lastWalkMs - 2 * GUY_UPDATE_INTERVAL_MS) / CAMERA_STOP_DIP_MS;
        let dip = 0;
        if (stoppedShare > 0 && stoppedShare < 1) {
            dip = CAMERA_STOP_DIP_PX * Math.sin(stoppedShare * Math.PI);
        }

        const shake = getCameraShake(currentMaze, x, y, nowMs);
        return {
            x,
            y,
            dirX: Math.cos(angle),
            dirY: Math.sin(angle),
            planeX: -Math.sin(angle) * planeLength,
            planeY: Math.cos(angle) * planeLength,
            horizonY: VIEW_H / 2 + bob + dip,
            shakeX: shake[0],
            shakeY: shake[1],
        };
    }

    // How far the view is jolted right now, [x, y] in pixels: nothing
    // unless a chasing bug is within CAMERA_SHAKE_DISTANCE_SQUARES, then a
    // jitter that grows as it closes in
    function getCameraShake(currentMaze, guyX, guyY, nowMs) {
        if (isPlayPaused()) {
            return [0, 0];
        }
        const nearest = Math.min(Infinity, ...getEnemyCenters(currentMaze)
            .filter((_, i) => !currentMaze.returningEnemyCorners.has(i) && !isEnemyFrightened(currentMaze, i, nowMs))
            .map(({ x, y }) => getDistanceSquares(guyX, guyY, x, y)));
        const closeness = clamp(1 - nearest / CAMERA_SHAKE_DISTANCE_SQUARES, 0, 1);
        const size = CAMERA_SHAKE_MAX_PX * closeness * closeness;
        return [
            size * (Math.sin(nowMs * 0.071) + 0.5 * Math.sin(nowMs * 0.173)) / 1.5,
            size * (Math.sin(nowMs * 0.089 + 1) + 0.5 * Math.sin(nowMs * 0.137)) / 1.5,
        ];
    }

    // How much of something this far away is lost in the haze, 0 to
    // FOG_MAX_SHARE
    function getFogShare(distance) {
        return FOG_MAX_SHARE * (1 - 2 ** (-((distance / FOG_HALF_DISTANCE_SQUARES) ** 2)));
    }

    // What glows right now: every bubble in flight, and every recent burst
    // fading away. Each is { x, y, strength } in squares.
    function getLights(currentMaze, nowMs) {
        const bubbles = currentMaze.bullets.map(({ x, y }) => ({ x, y, strength: BUBBLE_LIGHT_STRENGTH }));
        const bursts = currentMaze.flashes.map(({ x, y, startMs }) => ({
            x,
            y,
            strength: BUBBLE_FLASH_STRENGTH * clamp(1 - (nowMs - startMs) / BUBBLE_FLASH_MS, 0, 1),
        }));
        return [...bubbles, ...bursts].filter(({ strength }) => strength > 0);
    }

    // How brightly the lights shine on the point (x, y) of the maze
    function getGlowAt(lights, x, y) {
        let glow = 0;
        for (const light of lights) {
            const dx = x - light.x;
            const dy = y - light.y;
            const distanceSquared = dx * dx + dy * dy;
            if (distanceSquared < BUBBLE_LIGHT_REACH_SQUARES * BUBBLE_LIGHT_REACH_SQUARES) {
                glow += light.strength / (1 + distanceSquared * BUBBLE_LIGHT_FALLOFF);
            }
        }
        return glow;
    }

    // The floor and ceiling, worked out for every pixel of a half-size
    // picture and stretched over the view. Each screen row below the
    // horizon looks at the floor a set distance away (and above it, the
    // ceiling), so walking across the row steps across the maze: each
    // pixel takes the blacktop colour of the point it sees, from the copy
    // of the texture whose texels are about a pixel across there, plus any
    // bubble light, faded by the haze.
    const floorCanvas = document.createElement("canvas");
    floorCanvas.width = Math.round(VIEW_W * FLOOR_BUFFER_SCALE);
    floorCanvas.height = Math.round(VIEW_H * FLOOR_BUFFER_SCALE);
    const floorCtx = floorCanvas.getContext("2d");
    const floorImage = floorCtx.createImageData(floorCanvas.width, floorCanvas.height);
    const gravelLevels = createGravelLevels();
    function drawCeilingAndFloor(camera, lights) {
        const { width, height } = floorCanvas;
        const pixels = floorImage.data;
        const leftX = camera.dirX - camera.planeX;
        const leftY = camera.dirY - camera.planeY;
        const spanX = 2 * camera.planeX;
        const spanY = 2 * camera.planeY;
        const texelsPerSquare = GRAVEL_TEXTURE_PX / GRAVEL_TILE_SQUARES;

        for (let row = 0; row < height; row++) {
            const offset = (row + 0.5) / FLOOR_BUFFER_SCALE - camera.horizonY;
            const distance = VIEW_H / 2 / Math.max(Math.abs(offset), 0.5);
            const fog = getFogShare(distance);
            const stepX = (distance * spanX) / width;
            const stepY = (distance * spanY) / width;

            // How many texels one pixel spans here, across the row or from
            // this row to the next, picks the copy of the texture to use
            const rowSpan = (distance * distance * 2) / (VIEW_H * FLOOR_BUFFER_SCALE);
            const pixelSquares = Math.max(Math.hypot(stepX, stepY), rowSpan);
            let level = clamp(Math.floor(Math.log2(Math.max(1, pixelSquares * texelsPerSquare))), 0, gravelLevels.length - 1);
            let shade = 1;
            let glowShare = 1;
            if (offset <= 0) {
                level = Math.max(level, CEILING_BLUR_LEVEL);
                shade = CEILING_SHADE;
                glowShare = 0.6;
            }
            const { size, rgbs } = gravelLevels[level];
            const texelsPerSquareHere = size / GRAVEL_TILE_SQUARES;

            let worldX = camera.x + distance * leftX + stepX / 2;
            let worldY = camera.y + distance * leftY + stepY / 2;
            for (let column = 0; column < width; column++) {
                const texelX = ((Math.floor(worldX * texelsPerSquareHere) % size) + size) % size;
                const texelY = ((Math.floor(worldY * texelsPerSquareHere) % size) + size) % size;
                const texel = (texelY * size + texelX) * 3;
                let glow = 0;
                if (lights.length > 0) {
                    glow = getGlowAt(lights, worldX, worldY) * glowShare;
                }
                const index = (row * width + column) * 4;
                for (let channel = 0; channel < 3; channel++) {
                    const lit = rgbs[texel + channel] * shade + BUBBLE_LIGHT_RGB[channel] * glow;
                    pixels[index + channel] = lit * (1 - fog) + FOG_RGB[channel] * fog;
                }
                pixels[index + 3] = 255;
                worldX += stepX;
                worldY += stepY;
            }
        }

        floorCtx.putImageData(floorImage, 0, 0);
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(floorCanvas, 0, 0, VIEW_W, VIEW_H);
    }

    // The blacktop texture and its smaller copies, each { size, rgbs }
    // with rgbs holding red, green, blue for every texel. The full size
    // one is dark grey asphalt, gently blotched, with a fine grain, dark
    // pits and small pale stones in warm and cool greys; it wraps round at
    // its edges so repeats join up. Each next copy is half the size, every
    // texel the average of four.
    function createGravelLevels() {
        const size = GRAVEL_TEXTURE_PX;
        const wrap = (value) => ((value % size) + size) % size;
        const greys = new Float32Array(size * size * 3);

        // Blotches: a coarse grid of random shades, blended smoothly
        const blotchCells = 16;
        const blotches = Array.from({ length: blotchCells * blotchCells }, () => Math.random() - 0.5);
        const getBlotch = (cellX, cellY) => blotches[(cellY % blotchCells) * blotchCells + (cellX % blotchCells)];
        for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
                const cellX = (x / size) * blotchCells;
                const cellY = (y / size) * blotchCells;
                const [leftX, topY] = [Math.floor(cellX), Math.floor(cellY)];
                const [shareX, shareY] = [cellX - leftX, cellY - topY];
                const top = getBlotch(leftX, topY) * (1 - shareX) + getBlotch(leftX + 1, topY) * shareX;
                const bottom = getBlotch(leftX, topY + 1) * (1 - shareX) + getBlotch(leftX + 1, topY + 1) * shareX;
                const blotch = (top * (1 - shareY) + bottom * shareY) * 14;
                const grey = GRAVEL_BASE_GREY + blotch + (Math.random() - 0.5) * 16;
                const index = (y * size + x) * 3;
                greys[index] = grey;
                greys[index + 1] = grey + 1;
                greys[index + 2] = grey + 2;
            }
        }

        // Pits and stones: small soft-edged spots, darker or paler
        const addSpot = (centerX, centerY, radius, rgb) => {
            const reach = Math.ceil(radius + 1);
            for (let dy = -reach; dy <= reach; dy++) {
                for (let dx = -reach; dx <= reach; dx++) {
                    const cover = clamp(radius + 0.5 - Math.hypot(dx, dy), 0, 1);
                    if (cover === 0) {
                        continue;
                    }
                    const index = (wrap(Math.round(centerY) + dy) * size + wrap(Math.round(centerX) + dx)) * 3;
                    for (let channel = 0; channel < 3; channel++) {
                        greys[index + channel] += (rgb[channel] - greys[index + channel]) * cover;
                    }
                }
            }
        };
        for (let i = 0; i < size * size * GRAVEL_PITS_PER_TEXEL; i++) {
            const dark = 10 + Math.random() * 12;
            addSpot(Math.random() * size, Math.random() * size, 0.4 + Math.random() * 1.2, [dark, dark, dark + 1]);
        }
        for (let i = 0; i < size * size * GRAVEL_STONES_PER_TEXEL; i++) {
            const light = 55 + Math.random() ** 2 * 85;
            const warmth = (Math.random() - 0.5) * 14;
            addSpot(Math.random() * size, Math.random() * size, 0.3 + Math.random() * 1.1, [light + warmth, light, light - warmth]);
        }

        const levels = [{ size, rgbs: Uint8ClampedArray.from(greys) }];
        while (levels[levels.length - 1].size > 1) {
            const { size: bigSize, rgbs: big } = levels[levels.length - 1];
            const smallSize = bigSize / 2;
            const small = new Uint8ClampedArray(smallSize * smallSize * 3);
            for (let y = 0; y < smallSize; y++) {
                for (let x = 0; x < smallSize; x++) {
                    for (let channel = 0; channel < 3; channel++) {
                        const at = (bigX, bigY) => big[(bigY * bigSize + bigX) * 3 + channel];
                        small[(y * smallSize + x) * 3 + channel] = (
                            at(2 * x, 2 * y) + at(2 * x + 1, 2 * y) + at(2 * x, 2 * y + 1) + at(2 * x + 1, 2 * y + 1)
                        ) / 4;
                    }
                }
            }
            levels.push({ size: smallSize, rgbs: small });
        }
        return levels;
    }

    // Casts one ray per screen column through the grid and draws the wall
    // it hits as a vertical strip of Matrix rain. Returns each column's
    // wall distance, so nearer things can be drawn in front and farther
    // ones hidden behind.
    function drawWalls(currentMaze, camera, lights, nowMs) {
        const wallDepths = new Array(VIEW_W).fill(Infinity);

        for (let column = 0; column < VIEW_W; column++) {
            const cameraX = (2 * column) / VIEW_W - 1;
            const rayX = camera.dirX + camera.planeX * cameraX;
            const rayY = camera.dirY + camera.planeY * cameraX;
            const hit = castRay(currentMaze.walls, camera.x, camera.y, rayX, rayY);
            if (hit === null) {
                continue;
            }
            wallDepths[column] = hit.distance;
            // The distance is how far along the ray (not a unit length) the
            // wall is, so it also finds the point that was hit
            let glow = 0;
            if (lights.length > 0) {
                glow = getGlowAt(lights, camera.x + hit.distance * rayX, camera.y + hit.distance * rayY);
            }
            drawWallColumn(column, hit, camera.horizonY, glow, currentMaze, nowMs);
        }

        return wallDepths;
    }

    // Steps a ray square by square from (x, y) until it enters a wall.
    // Returns how far it went measured straight ahead (so walls don't
    // bulge like a fish-eye), which way the face it hit runs, where along
    // that face it hit (0 to 1), and which square, or null if it hits
    // nothing within MAX_RAY_STEPS squares.
    function castRay(walls, x, y, rayX, rayY) {
        let squareX = Math.floor(x);
        let squareY = Math.floor(y);
        const deltaX = Math.abs(1 / rayX);
        const deltaY = Math.abs(1 / rayY);

        let stepX = 1;
        let sideDistX = (squareX + 1 - x) * deltaX;
        if (rayX < 0) {
            stepX = -1;
            sideDistX = (x - squareX) * deltaX;
        }
        let stepY = 1;
        let sideDistY = (squareY + 1 - y) * deltaY;
        if (rayY < 0) {
            stepY = -1;
            sideDistY = (y - squareY) * deltaY;
        }

        for (let step = 0; step < MAX_RAY_STEPS; step++) {
            let isNorthSouthFace = false;
            if (sideDistX < sideDistY) {
                sideDistX += deltaX;
                squareX += stepX;
                isNorthSouthFace = true;
            } else {
                sideDistY += deltaY;
                squareY += stepY;
            }
            if (!isWallAt(walls, squareX, squareY)) {
                continue;
            }

            let distance = sideDistY - deltaY;
            let hitAlong = x + distance * rayX;
            if (isNorthSouthFace) {
                distance = sideDistX - deltaX;
                hitAlong = y + distance * rayY;
            }
            return {
                distance: Math.max(distance, 0.001),
                isNorthSouthFace,
                hitAlong: hitAlong - Math.floor(hitAlong),
                squareX,
                squareY,
                stepSign: isNorthSouthFace ? stepX : stepY,
            };
        }
        return null;
    }

    // One screen column of Matrix rain wall: a 1-pixel-wide slice of the
    // rain picture in the wall's colour (fading to a new one if it was just
    // shot), scrolled down at this glyph column's own speed, lit by any
    // nearby bubbles (glow) and faded into the haze by distance, with a
    // black seam down each corner
    function drawWallColumn(column, { distance, isNorthSouthFace, hitAlong, squareX, squareY, stepSign }, horizonY, glow, currentMaze, nowMs) {
        const wallHeight = VIEW_H / distance;
        const wallTop = horizonY - wallHeight / 2;
        const fog = getFogShare(distance);
        const fogColor = `rgba(${FOG_RGB.join(", ")}, ${fog})`;

        // Strips overlap a touch so no hairline gaps show between them once
        // the game is scaled to the window
        const edgeSide = getFaceEdgeSide(hitAlong);
        if (edgeSide !== 0 && isWallCorner(currentMaze.walls, { isNorthSouthFace, squareX, squareY, stepSign }, edgeSide)) {
            ctx.fillStyle = toColor(WALL_SEAM_RGB, 1);
            ctx.fillRect(column, wallTop, WALL_STRIP_OVERLAP_W, wallHeight);
            ctx.fillStyle = fogColor;
            ctx.fillRect(column, wallTop, WALL_STRIP_OVERLAP_W, wallHeight);
            return;
        }

        const look = currentMaze.wallLooks.get(wallKey(squareX, squareY));
        let lookPosition = 0;
        if (look !== undefined) {
            lookPosition = getWallLookPosition(look, nowMs);
        }
        const glyphColumn = Math.floor(hitAlong * MATRIX_COLUMNS_PER_WALL);
        const face = { squareX, squareY, isNorthSouthFace, glyphColumn };
        const rowsPerSecond = MATRIX_MIN_ROWS_PER_SECOND
            + (MATRIX_MAX_ROWS_PER_SECOND - MATRIX_MIN_ROWS_PER_SECOND) * getWallRandom(face, 0);
        const tileHeight = MATRIX_TILE_ROWS * MATRIX_GLYPH_PX;
        const scrolled = getWallRandom(face, 1) * tileHeight - (nowMs / 1000) * rowsPerSecond * MATRIX_GLYPH_PX;
        const sourceY = ((scrolled % tileHeight) + tileHeight) % tileHeight;
        const sourceX = Math.min(MATRIX_COLUMNS_PER_WALL * MATRIX_GLYPH_PX - 1, Math.floor(hitAlong * MATRIX_COLUMNS_PER_WALL * MATRIX_GLYPH_PX));
        const sourceHeight = MATRIX_ROWS_PER_WALL * MATRIX_GLYPH_PX;

        // A wall part way between two colours shows the first with the
        // second eased in over it. Every colour's rain has the same glyphs,
        // so only the colour changes.
        const paletteCount = MATRIX_PALETTE_RGBS.length;
        const fromIndex = Math.floor(lookPosition) % paletteCount;
        const between = lookPosition - Math.floor(lookPosition);
        const layers = [{ paletteIndex: fromIndex, alpha: 1 }];
        if (between > 0) {
            layers.push({ paletteIndex: (fromIndex + 1) % paletteCount, alpha: between * between * (3 - 2 * between) });
        }
        for (const { paletteIndex, alpha } of layers) {
            ctx.globalAlpha = alpha;
            ctx.drawImage(getMatrixTexture(paletteIndex), sourceX, sourceY, 1, sourceHeight, column, wallTop, WALL_STRIP_OVERLAP_W, wallHeight);
        }
        ctx.globalAlpha = 1;

        if (isNorthSouthFace) {
            ctx.fillStyle = `rgba(0, 0, 0, ${1 - SIDE_WALL_SHADE})`;
            ctx.fillRect(column, wallTop, WALL_STRIP_OVERLAP_W, wallHeight);
        }
        if (glow > 0) {
            ctx.globalCompositeOperation = "lighter";
            ctx.fillStyle = `rgba(${BUBBLE_LIGHT_RGB.join(", ")}, ${Math.min(1, glow * 0.6)})`;
            ctx.fillRect(column, wallTop, WALL_STRIP_OVERLAP_W, wallHeight);
            ctx.globalCompositeOperation = "source-over";
        }
        ctx.fillStyle = fogColor;
        ctx.fillRect(column, wallTop, WALL_STRIP_OVERLAP_W, wallHeight);
    }

    // Which edge of a wall face this point across it is on: -1 for the low
    // edge, 1 for the high edge, 0 for neither
    function getFaceEdgeSide(hitAlong) {
        if (hitAlong < WALL_SEAM_SHARE) {
            return -1;
        }
        if (hitAlong > 1 - WALL_SEAM_SHARE) {
            return 1;
        }
        return 0;
    }

    // True if this edge of a wall face is a corner. The face looks out
    // towards -stepSign. Past the edge, if there is no wall the face turns
    // away (an outside corner); if there is a wall with another wall in
    // front of it, the face meets a wall coming towards the guy (an inside
    // corner). Otherwise the next square just carries the same flat wall
    // on, and there is no corner.
    function isWallCorner(walls, { isNorthSouthFace, squareX, squareY, stepSign }, edgeSide) {
        let next = [squareX + edgeSide, squareY];
        let nextFront = [squareX + edgeSide, squareY - stepSign];
        if (isNorthSouthFace) {
            next = [squareX, squareY + edgeSide];
            nextFront = [squareX - stepSign, squareY + edgeSide];
        }
        return !isWallAt(walls, ...next) || isWallAt(walls, ...nextFront);
    }

    // The rain picture in one MATRIX_PALETTE_RGBS colour, drawn the first
    // time it is needed: MATRIX_COLUMNS_PER_WALL columns of random glyphs
    // on near-black. Down each column, two bright drops run half a tile
    // apart, each a near-white head with a trail fading above it, over dim
    // glyphs. The tile of MATRIX_TILE_ROWS rows is drawn twice, one under
    // the other, so any window of a wall's height can be cut from it as it
    // scrolls round. Every colour uses the same glyphs and drops, picked
    // once in MATRIX_LAYOUT, so fading between colours changes only the
    // colour.
    const MATRIX_LAYOUT = {
        headRows: Array.from({ length: MATRIX_COLUMNS_PER_WALL }, () => Math.floor(Math.random() * (MATRIX_TILE_ROWS / 2))),
        chars: Array.from({ length: MATRIX_COLUMNS_PER_WALL }, () => Array.from(
            { length: MATRIX_TILE_ROWS },
            () => MATRIX_GLYPHS[Math.floor(Math.random() * MATRIX_GLYPHS.length)],
        )),
    };
    const matrixTextures = new Map();
    function getMatrixTexture(paletteIndex) {
        if (matrixTextures.has(paletteIndex)) {
            return matrixTextures.get(paletteIndex);
        }
        const rainRgb = MATRIX_PALETTE_RGBS[paletteIndex];
        const headRgb = rainRgb.map((channel) => channel + (255 - channel) * MATRIX_HEAD_WHITENESS);
        const glyph = MATRIX_GLYPH_PX;
        const texture = document.createElement("canvas");
        texture.width = MATRIX_COLUMNS_PER_WALL * glyph;
        texture.height = 2 * MATRIX_TILE_ROWS * glyph;
        const textureCtx = texture.getContext("2d");
        textureCtx.fillStyle = toColor(MATRIX_BACKGROUND_RGB, 1);
        textureCtx.fillRect(0, 0, texture.width, texture.height);
        textureCtx.font = `bold ${glyph - 2}px monospace`;
        textureCtx.textAlign = "center";
        textureCtx.textBaseline = "middle";

        const dropSpacing = MATRIX_TILE_ROWS / 2;
        for (let column = 0; column < MATRIX_COLUMNS_PER_WALL; column++) {
            const headRow = MATRIX_LAYOUT.headRows[column];
            for (let row = 0; row < MATRIX_TILE_ROWS; row++) {
                const char = MATRIX_LAYOUT.chars[column][row];
                const rowsBehindHead = (((headRow - row) % dropSpacing) + dropSpacing) % dropSpacing;
                let color = toColor(rainRgb, MATRIX_DIM_SHARE);
                if (rowsBehindHead === 0) {
                    color = toColor(headRgb, 1);
                } else if (rowsBehindHead < MATRIX_TRAIL_ROWS) {
                    color = toColor(rainRgb, 1 - rowsBehindHead / MATRIX_TRAIL_ROWS * (1 - MATRIX_DIM_SHARE));
                }
                textureCtx.fillStyle = color;
                for (const tile of [0, 1]) {
                    textureCtx.fillText(char, (column + 0.5) * glyph, (tile * MATRIX_TILE_ROWS + row + 0.5) * glyph);
                }
            }
        }
        matrixTextures.set(paletteIndex, texture);
        return texture;
    }

    // A steady random number from 0 to 1 for one glyph column of one wall
    // face and one purpose (salt), so each column keeps its own rain
    function getWallRandom({ squareX, squareY, isNorthSouthFace, glyphColumn }, salt) {
        let seed = squareX * 73856093 ^ squareY * 19349663 ^ glyphColumn * 83492791 ^ salt * 2654435761;
        if (isNorthSouthFace) {
            seed ^= 0x5bd1e995;
        }
        seed = Math.imul(seed ^ (seed >>> 15), 0x2c1b3c6d);
        seed = Math.imul(seed ^ (seed >>> 12), 0x297a2d39);
        return ((seed ^ (seed >>> 15)) >>> 0) / 4294967296;
    }

    function toColor(rgb, light) {
        const [r, g, b] = rgb.map((channel) => Math.round(clamp(channel * light, 0, 255)));
        return `rgb(${r}, ${g}, ${b})`;
    }

    // Where a point in the maze lands on screen: its column, its distance
    // straight ahead, and the pixel size of one wall-height there. null if
    // it is behind the guy.
    function projectPoint(camera, worldX, worldY) {
        const relativeX = getWrappedDeltaX(camera.x, worldX);
        const relativeY = worldY - camera.y;
        const inverse = 1 / (camera.planeX * camera.dirY - camera.dirX * camera.planeY);
        const sideways = inverse * (camera.dirY * relativeX - camera.dirX * relativeY);
        const depth = inverse * (-camera.planeY * relativeX + camera.planeX * relativeY);
        if (depth <= 0.05) {
            return null;
        }
        return {
            screenX: (VIEW_W / 2) * (1 + sideways / depth),
            depth,
            unitPx: VIEW_H / depth,
        };
    }

    // Enemies, dots, pellets and bullets, drawn farthest first so nearer
    // ones cover them, and each hidden wherever a wall is closer
    function drawWorldObjects(currentMaze, camera, wallDepths, nowMs) {
        const objects = [];

        for (const key of currentMaze.dots) {
            const [x, y] = key.split(",").map(Number);
            objects.push({ x: x + 0.5, y: y + 0.5, kind: "ball", heightShare: DOT_HEIGHT_SHARE, radiusShare: DOT_RADIUS_SHARE, color: DOT_COLOR });
        }
        for (const key of currentMaze.powerPellets) {
            const [x, y] = key.split(",").map(Number);
            objects.push({ x: x + 0.5, y: y + 0.5, kind: "pellet" });
        }
        // Bubbles still coming out of the nozzle are drawn with the blaster
        for (const { x, y, bornMs } of currentMaze.bullets) {
            if (nowMs - bornMs >= BUBBLE_LAUNCH_MS) {
                objects.push({ x, y, kind: "bubble" });
            }
        }
        getEnemyCenters(currentMaze).forEach(({ x, y }, i) => {
            objects.push({ x, y, kind: "enemy", index: i });
        });

        const projected = objects
            .map((object) => ({ object, view: projectPoint(camera, object.x, object.y) }))
            .filter(({ view }) => view !== null)
            .sort((a, b) => b.view.depth - a.view.depth);

        for (const { object, view } of projected) {
            if (object.kind === "enemy") {
                drawEnemy(currentMaze, object.index, view, camera, wallDepths, nowMs);
                continue;
            }
            if (object.kind === "bubble") {
                drawWorldBubble(view, camera, wallDepths);
                continue;
            }
            if (object.kind === "pellet") {
                drawWorldPellet(view, camera, wallDepths, nowMs);
                continue;
            }
            drawBall(object, view, camera, wallDepths);
        }
    }

    // A bubble the guy has blown, floating at chest height, drawn only if
    // no wall is in front of it
    function drawWorldBubble(view, camera, wallDepths) {
        const column = Math.round(view.screenX);
        if (column < 0 || column >= VIEW_W || wallDepths[column] < view.depth) {
            return;
        }
        const { x, y, radius } = getWorldBubbleOnScreen(view, camera);
        drawBubble(x, y, radius, 1 - getFogShare(view.depth));
    }

    // A power pellet floating over the floor, pulsing gently so it catches
    // the eye down a corridor, drawn only if no wall is in front of it
    function drawWorldPellet(view, camera, wallDepths, nowMs) {
        const column = Math.round(view.screenX);
        if (column < 0 || column >= VIEW_W || wallDepths[column] < view.depth) {
            return;
        }
        const pulse = 1 + 0.15 * Math.sin(nowMs / 150);
        const floorY = camera.horizonY + view.unitPx / 2;
        const centerY = floorY - DOT_HEIGHT_SHARE * view.unitPx;
        // Pellets shine through the haze more than anything else
        ctx.globalAlpha = 1 - getFogShare(view.depth) * 0.7;
        drawRainbowBall(view.screenX, centerY, Math.max(2, POWER_PELLET_RADIUS_SHARE * view.unitPx * pulse), nowMs);
        ctx.globalAlpha = 1;
    }

    // A ball swirled with every colour of the rainbow, slowly spinning, with
    // a white shine on its top left
    function drawRainbowBall(x, y, radius, nowMs) {
        const spin = (nowMs / PELLET_SPIN_MS) * Math.PI * 2;
        const rainbow = ctx.createConicGradient(spin, x, y);
        PELLET_RAINBOW_COLORS.forEach((color, i) => {
            rainbow.addColorStop(i / (PELLET_RAINBOW_COLORS.length - 1), color);
        });
        ctx.fillStyle = rainbow;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();

        const shine = ctx.createRadialGradient(x - radius * 0.35, y - radius * 0.4, 0, x - radius * 0.35, y - radius * 0.4, radius * 0.6);
        shine.addColorStop(0, "rgba(255, 255, 255, 0.85)");
        shine.addColorStop(1, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = shine;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
    }

    // Where a bubble in the maze shows on screen, and how big
    function getWorldBubbleOnScreen(view, camera) {
        const floorY = camera.horizonY + view.unitPx / 2;
        return {
            x: view.screenX,
            y: floorY - BULLET_HEIGHT_SHARE * view.unitPx,
            radius: Math.max(2, BULLET_RADIUS_SHARE * view.unitPx),
        };
    }

    // A soap bubble: see-through blue, a bright rim and a shine in its top
    // left, all faded by opacity
    function drawBubble(x, y, radius, opacity) {
        ctx.globalAlpha = opacity;
        ctx.fillStyle = BUBBLE_FILL_COLOR;
        ctx.strokeStyle = BUBBLE_EDGE_COLOR;
        ctx.lineWidth = Math.max(1.5, radius * 0.08);
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = BUBBLE_SHINE_COLOR;
        ctx.beginPath();
        ctx.ellipse(x - radius * 0.35, y - radius * 0.4, radius * 0.22, radius * 0.13, -0.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // A round thing (dot or pellet) floating at its height, faded into the
    // haze by distance, drawn only if no wall is in front of it
    function drawBall({ heightShare, radiusShare, color }, view, camera, wallDepths) {
        const column = Math.round(view.screenX);
        if (column < 0 || column >= VIEW_W || wallDepths[column] < view.depth) {
            return;
        }
        const floorY = camera.horizonY + view.unitPx / 2;
        const centerY = floorY - heightShare * view.unitPx;
        const radius = Math.max(1, radiusShare * view.unitPx);

        ctx.globalAlpha = 1 - getFogShare(view.depth) * 0.85;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(view.screenX, centerY, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // An enemy standing on the floor, scuttling, with a soft shadow under
    // it, face on if it is coming at the guy or else crawling side-on the
    // way it is crossing the view, and faded into the haze by distance. The bug is drawn one screen column at a time so
    // a wall in front of part of it hides just that part; the shadow shows
    // only if the middle of the bug is in sight.
    function drawEnemy(currentMaze, index, view, camera, wallDepths, nowMs) {
        const hasTarget = isEnemyFrightened(currentMaze, index, nowMs);
        const legFrame = Math.floor(nowMs / BUG_LEG_STEP_MS) % 2;
        const { x, y } = currentMaze.enemyPositions[index];
        const side = getBugCrawlSide(index, currentMaze.enemyHeadings[index], x, y, camera);
        let sprite = getEnemySprite(getEnemyColor(currentMaze, index, nowMs), hasTarget, legFrame, side);
        let alpha = 1 - getFogShare(view.depth) * 0.9;
        if (currentMaze.returningEnemyCorners.has(index)) {
            sprite = getEnemySprite(RETURNING_ENEMY_COLOR, false, legFrame, side);
            alpha *= RETURNING_ENEMY_ALPHA;
        }

        const height = ENEMY_HEIGHT_SHARE * view.unitPx;
        const width = (height * sprite.width) / sprite.height;
        const floorY = camera.horizonY + view.unitPx / 2;
        const top = floorY - height;
        const left = view.screenX - width / 2;

        const middleColumn = Math.round(view.screenX);
        const isMiddleInSight = middleColumn >= 0 && middleColumn < VIEW_W && wallDepths[middleColumn] >= view.depth;
        if (isMiddleInSight) {
            ctx.globalAlpha = BUG_SHADOW_ALPHA * alpha;
            ctx.fillStyle = "#000000";
            ctx.beginPath();
            ctx.ellipse(view.screenX, floorY - height * 0.04, width * 0.4, height * 0.09, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.globalAlpha = alpha;
        const firstColumn = Math.max(0, Math.floor(left));
        const lastColumn = Math.min(VIEW_W - 1, Math.ceil(left + width));
        for (let column = firstColumn; column <= lastColumn; column++) {
            if (wallDepths[column] < view.depth) {
                continue;
            }
            const sourceX = Math.floor(((column - left) / width) * sprite.width);
            if (sourceX < 0 || sourceX >= sprite.width) {
                continue;
            }
            ctx.drawImage(sprite, sourceX, 0, 1, sprite.height, column, top, 1, height);
        }
        ctx.globalAlpha = 1;
    }

    // Normal colour, or grey while frightened, flashing white at an even
    // pace as the power runs out
    function getEnemyColor(currentMaze, index, nowMs) {
        if (!isEnemyFrightened(currentMaze, index, nowMs)) {
            return ENEMY_BODY_COLORS[index % ENEMY_BODY_COLORS.length];
        }

        if (isPowerEndingFlash(currentMaze, nowMs)) {
            return FRIGHTENED_FLASH_COLOR;
        }
        return FRIGHTENED_ENEMY_COLOR;
    }

    // True during the flashes that warn the power is running out. Counting
    // 250 ms blocks back from the end, odd blocks flash, so the first flash
    // starts exactly FRIGHTENED_FLASH_FINAL_MS out and every flash and gap
    // is a full block.
    function isPowerEndingFlash(currentMaze, nowMs) {
        const msLeft = currentMaze.frightenedUntilMs - nowMs;
        const isFlashBlock = Math.floor(msLeft / FRIGHTENED_FLASH_PERIOD_MS) % 2 === 1;
        return msLeft > 0 && msLeft < FRIGHTENED_FLASH_FINAL_MS && isFlashBlock;
    }

    // Which way each bug was last drawn crawling across the view, by enemy
    // index, so it only flips once it is clearly crossing the other way
    const bugCrawlSides = new Map();

    // Which way a bug at (x, y) walking along heading is seen: "front" when
    // it is coming at the guy, otherwise crawling "left" or "right" across
    // the view. One walking nearly straight away keeps the way it was
    // crawling.
    function getBugCrawlSide(index, heading, x, y, camera) {
        const towardGuy = Math.atan2(camera.y - y, getWrappedDeltaX(x, camera.x));
        const offCourse = Math.abs(Math.atan2(Math.sin(heading - towardGuy), Math.cos(heading - towardGuy)));
        if (offCourse < BUG_FRONT_VIEW_RADIANS) {
            return "front";
        }
        const across = Math.cos(heading) * camera.planeX + Math.sin(heading) * camera.planeY;
        if (across > BUG_FLIP_ACROSS_SHARE) {
            bugCrawlSides.set(index, "right");
        }
        if (across < -BUG_FLIP_ACROSS_SHARE) {
            bugCrawlSides.set(index, "left");
        }
        return bugCrawlSides.get(index) ?? "right";
    }

    // The enemy as a bug in one colour, low on its belly, crawling side-on
    // toward the "left" or "right" or coming straight on ("front"),
    // shaded as if lit from above: a long domed shell with dark spots and
    // a shine, a round head with glossy eyes and feelers, and three
    // tube-shaded legs each side. legFrame (0 or 1)
    // picks which legs are lifted, so swapping frames makes it scuttle.
    // Drawn into its own small canvas the first time it is needed; the
    // left side is the right side mirrored.
    // hasTarget paints a red-and-white bullseye on the middle of its body,
    // shown on frightened enemies to say they are safe to hit
    function getEnemySprite(color, hasTarget, legFrame = 0, side = "right") {
        const cacheKey = `${color}|${hasTarget}|${legFrame}|${side}`;
        if (!enemySpriteCache.has(cacheKey)) {
            const block = ENEMY_SPRITE_BLOCK_PX;
            const sprite = document.createElement("canvas");
            sprite.width = 4 * block;
            sprite.height = 3 * block;
            const spriteCtx = sprite.getContext("2d");
            spriteCtx.lineCap = "round";
            spriteCtx.lineJoin = "round";
            if (side === "left") {
                spriteCtx.translate(sprite.width, 0);
                spriteCtx.scale(-1, 1);
            }
            const bug = { color, rgb: parseHexColor(color), legFrame, block };
            let shellCenter = null;
            if (side === "front") {
                shellCenter = drawBugFront(spriteCtx, bug);
            } else {
                shellCenter = drawBugSide(spriteCtx, bug);
            }

            if (hasTarget) {
                // Rings from the outside in, alternating red and white, on
                // the shell
                TARGET_RING_RADII_BLOCKS.forEach((radius, i) => {
                    spriteCtx.fillStyle = TARGET_RING_COLORS[i % TARGET_RING_COLORS.length];
                    spriteCtx.beginPath();
                    spriteCtx.arc(shellCenter[0], shellCenter[1], radius * block, 0, Math.PI * 2);
                    spriteCtx.fill();
                });
            }
            enemySpriteCache.set(cacheKey, sprite);
        }
        return enemySpriteCache.get(cacheKey);
    }

    // The bug crawling straight at the guy, low on its belly: legs splayed
    // out both sides, the far pairs higher up and in shadow, a wide low
    // shell behind, and its head in front with both eyes looking at him
    // and feelers up. Returns the shell's middle.
    function drawBugFront(spriteCtx, bug) {
        const { block, rgb, legFrame } = bug;
        const centerX = 2 * block;
        const shellY = 1.7 * block;
        const headY = 2.05 * block;

        // Back legs first, front ones last, each pair lifting on opposite
        // frames
        const drawLegPair = (legIndex) => {
            const depth = [0.3, 0.15, 0][legIndex];
            for (const side of [-1, 1]) {
                const isLifted = (legIndex + legFrame + (side > 0 ? 1 : 0)) % 2 === 0;
                let lift = 0;
                if (isLifted) {
                    lift = BUG_LEG_LIFT_BLOCKS * block;
                }
                const hipY = (2.05 - depth) * block;
                drawBugLeg(spriteCtx, bug, [
                    [centerX + side * (0.75 + depth) * block, hipY],
                    [centerX + side * (1.4 + depth) * block, hipY - 0.35 * block - lift / 2],
                    [centerX + side * (1.8 + depth / 2) * block, (2.9 - depth) * block - lift],
                ], -depth * 1.5);
            }
        };
        drawLegPair(0);
        drawLegPair(1);
        drawBugShell(spriteCtx, bug, centerX, shellY, 1.2 * block, 0.7 * block);
        drawLegPair(2);

        // Feelers up and out from the top of the head
        for (const side of [-1, 1]) {
            spriteCtx.strokeStyle = toColor(shadeRgb(rgb, -0.5), 1);
            spriteCtx.lineWidth = 0.08 * block;
            spriteCtx.beginPath();
            spriteCtx.moveTo(centerX + side * 0.2 * block, headY - 0.4 * block);
            spriteCtx.quadraticCurveTo(centerX + side * 0.4 * block, 0.85 * block, centerX + side * 0.8 * block, 0.8 * block);
            spriteCtx.stroke();
            fillShadedBall(spriteCtx, centerX + side * 0.8 * block, 0.8 * block, 0.1 * block, rgb);
        }

        drawBugHead(spriteCtx, bug, centerX, headY, 0.5 * block);

        // Fangs, then pincers sweeping out and hooking back in under the
        // head
        for (const side of [-1, 1]) {
            drawBugFang(spriteCtx, block, centerX + side * 0.1 * block, headY + 0.36 * block);
        }
        for (const side of [-1, 1]) {
            drawBugMandible(
                spriteCtx, bug,
                [centerX + side * 0.28 * block, headY + 0.3 * block],
                [centerX + side * 0.85 * block, headY + 0.6 * block],
                [centerX + side * 0.3 * block, headY + 0.72 * block],
                0,
            );
        }

        // Eyes glaring at the guy, brows slanting down toward the middle
        for (const side of [-1, 1]) {
            drawBugEye(spriteCtx, block, centerX + side * 0.21 * block, headY - 0.06 * block, 0, -side * BUG_BROW_TILT_RADIANS);
        }
        return [centerX, shellY];
    }

    // The bug crossing the view, facing right: its far legs in shadow
    // behind, a long low shell, its head out in front with one eye looking
    // ahead and feelers reaching forward, and its near legs over the
    // shell's edge. Returns the shell's middle.
    function drawBugSide(spriteCtx, bug) {
        const { block, rgb, legFrame } = bug;
        const shellX = 1.75 * block;
        const shellY = 1.75 * block;
        const headX = 3.15 * block;
        const headY = 1.7 * block;

        // Legs: from under the shell, up to a knee, and down to the floor,
        // front legs reaching forward and back legs back. Near and far legs
        // lift on opposite frames.
        const drawLegRow = (isNear) => {
            [-1, 0, 1].forEach((reach, legIndex) => {
                const isLifted = (legIndex + legFrame + (isNear ? 1 : 0)) % 2 === 0;
                let lift = 0;
                if (isLifted) {
                    lift = BUG_LEG_LIFT_BLOCKS * block;
                }
                const hipX = shellX + reach * 0.6 * block;
                const shift = isNear ? 0 : 0.12 * block;
                drawBugLeg(spriteCtx, bug, [
                    [hipX + shift, 2.15 * block - shift],
                    [hipX + reach * 0.35 * block + shift, 2.05 * block - lift / 2 - shift],
                    [hipX + reach * 0.6 * block + shift, 2.85 * block - lift - shift],
                ], isNear ? 0 : -0.35);
            });
        };
        drawLegRow(false);

        // Feelers: the far one first, both reaching forward and up
        for (const shift of [0.1, 0]) {
            spriteCtx.strokeStyle = toColor(shadeRgb(rgb, -0.5 - shift * 2), 1);
            spriteCtx.lineWidth = 0.08 * block;
            spriteCtx.beginPath();
            spriteCtx.moveTo(headX + 0.15 * block, headY - 0.4 * block - shift * block);
            spriteCtx.quadraticCurveTo(headX + 0.35 * block, 0.55 * block, headX + 0.75 * block, (0.65 - shift) * block);
            spriteCtx.stroke();
            fillShadedBall(spriteCtx, headX + 0.75 * block, (0.65 - shift) * block, 0.1 * block, rgb);
        }

        drawBugShell(spriteCtx, bug, shellX, shellY, 1.3 * block, 0.85 * block);
        drawLegRow(true);

        // Pincers reaching forward from under the head and hooking down,
        // the far one darker, and a fang
        for (const shift of [0.1, 0]) {
            drawBugMandible(
                spriteCtx, bug,
                [headX + 0.25 * block, headY + 0.3 * block - shift * block],
                [headX + 0.8 * block, headY + 0.05 * block - shift * block],
                [headX + 0.65 * block, headY + 0.5 * block - shift * block],
                -shift * 3,
            );
        }
        drawBugFang(spriteCtx, block, headX + 0.3 * block, headY + 0.38 * block);

        drawBugHead(spriteCtx, bug, headX, headY, 0.5 * block);
        drawBugEye(spriteCtx, block, headX + 0.22 * block, headY - 0.1 * block, 0.05 * block, BUG_BROW_TILT_RADIANS);
        return [shellX, shellY];
    }

    // One leg through these points, as a tube: a dark edge, the body
    // colour and a thin shine along the top, all darkened by `darken`,
    // with a sharp spur sticking up from the knee
    function drawBugLeg(spriteCtx, { block, rgb }, points, darken) {
        const [kneeX, kneeY] = points[1];
        const outward = Math.sign(points[2][0] - points[0][0]) || 1;
        spriteCtx.fillStyle = toColor(shadeRgb(rgb, Math.max(-1, -0.8 + darken)), 1);
        spriteCtx.beginPath();
        spriteCtx.moveTo(kneeX - 0.06 * block, kneeY);
        spriteCtx.lineTo(kneeX + outward * 0.1 * block, kneeY - BUG_LEG_SPUR_BLOCKS * block);
        spriteCtx.lineTo(kneeX + 0.06 * block, kneeY);
        spriteCtx.fill();

        const strokes = [
            { width: 0.2, shade: -0.6, shiftY: 0 },
            { width: 0.12, shade: -0.1, shiftY: 0 },
            { width: 0.04, shade: 0.5, shiftY: -0.035 },
        ];
        for (const stroke of strokes) {
            spriteCtx.strokeStyle = toColor(shadeRgb(rgb, Math.max(-1, stroke.shade + darken)), 1);
            spriteCtx.lineWidth = stroke.width * block;
            spriteCtx.beginPath();
            points.forEach(([x, y]) => spriteCtx.lineTo(x, y + stroke.shiftY * block));
            spriteCtx.stroke();
        }
    }

    // The domed shell: a row of dark spikes along its top, then the shell
    // lit at its upper left and dark round its rim, with dark spots and a
    // shine
    function drawBugShell(spriteCtx, { block, rgb, color }, centerX, centerY, radiusX, radiusY) {
        const shade = (amount) => toColor(shadeRgb(rgb, amount), 1);

        // Each spike stands out from the rim, square to it, its base
        // tucked under the shell's edge
        spriteCtx.fillStyle = shade(-0.8);
        for (let i = 0; i < BUG_SHELL_SPIKE_COUNT; i++) {
            const angle = Math.PI * (1.18 + (0.64 * i) / (BUG_SHELL_SPIKE_COUNT - 1));
            const rimX = centerX + Math.cos(angle) * radiusX;
            const rimY = centerY + Math.sin(angle) * radiusY;
            const normal = Math.atan2(Math.sin(angle) * radiusX, Math.cos(angle) * radiusY);
            const length = BUG_SHELL_SPIKE_BLOCKS * block;
            const halfBase = 0.09 * block;
            spriteCtx.beginPath();
            spriteCtx.moveTo(rimX - Math.cos(normal) * 0.05 * block - Math.sin(normal) * halfBase, rimY - Math.sin(normal) * 0.05 * block + Math.cos(normal) * halfBase);
            spriteCtx.lineTo(rimX + Math.cos(normal) * length, rimY + Math.sin(normal) * length);
            spriteCtx.lineTo(rimX - Math.cos(normal) * 0.05 * block + Math.sin(normal) * halfBase, rimY - Math.sin(normal) * 0.05 * block - Math.cos(normal) * halfBase);
            spriteCtx.fill();
        }

        const gradient = spriteCtx.createRadialGradient(
            centerX - 0.35 * radiusX, centerY - 0.45 * radiusY, 0.05 * block,
            centerX, centerY, 1.2 * Math.max(radiusX, radiusY),
        );
        gradient.addColorStop(0, shade(0.35));
        gradient.addColorStop(0.3, color);
        gradient.addColorStop(1, shade(-0.85));
        spriteCtx.fillStyle = gradient;
        spriteCtx.strokeStyle = BUG_OUTLINE_COLOR;
        spriteCtx.lineWidth = 0.05 * block;
        spriteCtx.beginPath();
        spriteCtx.ellipse(centerX, centerY, radiusX, radiusY, 0, 0, Math.PI * 2);
        spriteCtx.fill();
        spriteCtx.stroke();

        const scaleX = radiusX / (0.95 * block);
        const scaleY = radiusY / (1.1 * block);
        spriteCtx.fillStyle = shade(-0.55);
        spriteCtx.globalAlpha = 0.7;
        for (const [spotX, spotY, spotRadius] of BUG_SPOTS_BLOCKS) {
            spriteCtx.beginPath();
            spriteCtx.ellipse(
                centerX + spotX * block * scaleX, centerY + spotY * block * scaleY,
                spotRadius * block * scaleX, spotRadius * 0.85 * block * scaleY, 0, 0, Math.PI * 2,
            );
            spriteCtx.fill();
        }
        spriteCtx.globalAlpha = 1;

        spriteCtx.fillStyle = "rgba(255, 255, 255, 0.3)";
        spriteCtx.beginPath();
        spriteCtx.ellipse(centerX - 0.42 * radiusX, centerY - 0.5 * radiusY, 0.24 * block, 0.12 * block, -0.6, 0, Math.PI * 2);
        spriteCtx.fill();
    }

    // The head: a ball a shade darker than the shell
    function drawBugHead(spriteCtx, { block, rgb }, centerX, centerY, radius) {
        fillShadedBall(spriteCtx, centerX, centerY, radius, shadeRgb(rgb, BUG_HEAD_DARKEN));
        spriteCtx.strokeStyle = BUG_OUTLINE_COLOR;
        spriteCtx.lineWidth = 0.05 * block;
        spriteCtx.beginPath();
        spriteCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
        spriteCtx.stroke();
    }

    // An angry eye: glowing yellow to orange, a black slit pupil shifted
    // sideways by lookX, a glint, and a dark scowling lid cut across its
    // top at browTilt radians (positive slopes down to the right), with a
    // heavy brow along the lid's edge
    function drawBugEye(spriteCtx, block, eyeX, eyeY, lookX, browTilt) {
        const radius = BUG_EYE_RADIUS_BLOCKS * block;
        const glow = spriteCtx.createRadialGradient(eyeX, eyeY, 0, eyeX, eyeY, radius);
        BUG_EYE_COLORS.forEach((color, i) => glow.addColorStop(i / (BUG_EYE_COLORS.length - 1), color));
        spriteCtx.save();
        spriteCtx.shadowColor = BUG_EYE_GLOW_COLOR;
        spriteCtx.shadowBlur = 0.35 * block;
        spriteCtx.fillStyle = glow;
        spriteCtx.beginPath();
        spriteCtx.arc(eyeX, eyeY, radius, 0, Math.PI * 2);
        spriteCtx.fill();
        spriteCtx.restore();

        spriteCtx.fillStyle = "#000000";
        spriteCtx.beginPath();
        spriteCtx.ellipse(eyeX + lookX, eyeY + 0.02 * block, 0.035 * block, 0.12 * block, 0, 0, Math.PI * 2);
        spriteCtx.fill();
        spriteCtx.fillStyle = "#ffffff";
        spriteCtx.beginPath();
        spriteCtx.arc(eyeX + lookX - 0.06 * block, eyeY + 0.03 * block, 0.025 * block, 0, Math.PI * 2);
        spriteCtx.fill();

        // The lid: everything of the eye above a slanted line just over its
        // middle, then the brow drawn along that line and a little past it
        spriteCtx.save();
        spriteCtx.translate(eyeX, eyeY - 0.03 * block);
        spriteCtx.rotate(browTilt);
        spriteCtx.save();
        spriteCtx.beginPath();
        spriteCtx.arc(0, 0.03 * block, radius, 0, Math.PI * 2);
        spriteCtx.clip();
        spriteCtx.fillStyle = BUG_LID_COLOR;
        spriteCtx.fillRect(-radius * 1.5, -radius * 2, radius * 3, radius * 2);
        spriteCtx.restore();
        spriteCtx.strokeStyle = BUG_LID_COLOR;
        spriteCtx.lineCap = "round";
        spriteCtx.lineWidth = 0.08 * block;
        spriteCtx.beginPath();
        spriteCtx.moveTo(-radius * 1.25, 0);
        spriteCtx.lineTo(radius * 1.25, 0);
        spriteCtx.stroke();
        spriteCtx.restore();
    }

    // A hooked pincer jaw from its root to its tip, bending through bend:
    // thick and dark at the root, ending in a pale sharp hook
    function drawBugMandible(spriteCtx, { block, rgb }, [rootX, rootY], [bendX, bendY], [tipX, tipY], darken) {
        const layers = [
            { width: 0.22, color: toColor(shadeRgb(rgb, Math.max(-1, -0.8 + darken)), 1) },
            { width: 0.1, color: toColor(shadeRgb(rgb, Math.max(-1, -0.45 + darken)), 1) },
        ];
        for (const { width, color } of layers) {
            spriteCtx.strokeStyle = color;
            spriteCtx.lineWidth = width * block;
            spriteCtx.beginPath();
            spriteCtx.moveTo(rootX, rootY);
            spriteCtx.quadraticCurveTo(bendX, bendY, tipX, tipY);
            spriteCtx.stroke();
        }

        // The hook carries on past the tip the way the jaw was curving
        const along = Math.atan2(tipY - bendY, tipX - bendX);
        const hookLength = 0.22 * block;
        const halfBase = 0.08 * block;
        spriteCtx.fillStyle = BUG_FANG_COLOR;
        spriteCtx.beginPath();
        spriteCtx.moveTo(tipX - Math.sin(along) * halfBase, tipY + Math.cos(along) * halfBase);
        spriteCtx.lineTo(tipX + Math.cos(along) * hookLength, tipY + Math.sin(along) * hookLength);
        spriteCtx.lineTo(tipX + Math.sin(along) * halfBase, tipY - Math.cos(along) * halfBase);
        spriteCtx.fill();
    }

    // A pale fang hanging from (x, y)
    function drawBugFang(spriteCtx, block, x, y) {
        spriteCtx.fillStyle = BUG_FANG_COLOR;
        spriteCtx.beginPath();
        spriteCtx.moveTo(x - 0.06 * block, y);
        spriteCtx.lineTo(x, y + 0.24 * block);
        spriteCtx.lineTo(x + 0.06 * block, y);
        spriteCtx.fill();
    }

    // A ball in this colour, lit from the upper left: bright where the
    // light hits, darkening round to the far side
    function fillShadedBall(targetCtx, x, y, radius, rgb) {
        const gradient = targetCtx.createRadialGradient(x - radius * 0.35, y - radius * 0.4, radius * 0.05, x, y, radius);
        gradient.addColorStop(0, toColor(shadeRgb(rgb, 0.65), 1));
        gradient.addColorStop(0.4, toColor(rgb, 1));
        gradient.addColorStop(1, toColor(shadeRgb(rgb, -0.6), 1));
        targetCtx.fillStyle = gradient;
        targetCtx.beginPath();
        targetCtx.arc(x, y, radius, 0, Math.PI * 2);
        targetCtx.fill();
    }

    // The colour moved towards white (amount above 0) or black (below 0),
    // by that share of the way
    function shadeRgb(rgb, amount) {
        if (amount >= 0) {
            return rgb.map((channel) => channel + (255 - channel) * amount);
        }
        return rgb.map((channel) => channel * (1 + amount));
    }

    // [r, g, b] from a "#rrggbb" colour
    function parseHexColor(hex) {
        return [1, 3, 5].map((start) => parseInt(hex.slice(start, start + 2), 16));
    }

    // ---- The bubble blaster, a small 3D model ----

    // The guy's toy bubble blaster in the lower right of the view: swaying
    // as he walks, kicking back when he fires, with a pop ring at the nozzle
    // just after a shot. Every face of the model is placed in front of the
    // eye, lit, and drawn farthest first.
    function drawBubbleBlaster(currentMaze, camera, nowMs) {
        const placement = getBlasterPlacement(currentMaze, nowMs);
        const toEye = (point) => placeBlasterPoint(point, placement);

        // While the guy is powered up, a single rainbow ring travels up and
        // down the blaster, except during the flashes that warn the power is
        // running out. Tube wall faces whose middle is within the ring take
        // its colour: the hue goes round with the angle around the barrel, so
        // the ring shows every colour, and slowly spins.
        const isRingShowing = nowMs < currentMaze.frightenedUntilMs && !isPowerEndingFlash(currentMaze, nowMs);
        const ringTravel = 0.5 - 0.5 * Math.cos((2 * Math.PI * nowMs) / BLASTER_RING_TRAVEL_MS);
        const ringZ = BLASTER_RING_BACK_Z + (BLASTER_RING_FRONT_Z - BLASTER_RING_BACK_Z) * ringTravel;
        const getFaceRgb = (part, faceIndex, modelCenter) => {
            const isTubeWall = faceIndex < (part.wallFaceCount ?? 0);
            if (!isRingShowing || !isTubeWall || Math.abs(modelCenter[2] - ringZ) > BLASTER_RING_HALF_WIDTH) {
                return part.rgb;
            }
            const aroundDegrees = (Math.atan2(modelCenter[1], modelCenter[0]) * 180) / Math.PI;
            return hueToRgb(aroundDegrees + (nowMs / BLASTER_RING_SPIN_MS) * 360);
        };

        // Every face of every tube and box, and every ball, as one list to
        // draw farthest first
        const drawables = getBlasterParts().flatMap((part) => {
            const partCenter = toEye(part.center);
            if (part.radius !== undefined) {
                return [{ depth: partCenter[2], draw: () => drawShadedBall(partCenter, part.radius, part.rgb, part.alpha) }];
            }
            return part.faces
                .map((face, faceIndex) => {
                    const points = face.map(toEye);
                    const center = averagePoints(points);
                    let normal = normalizeVector(getPolygonNormal(points));
                    // Point the normal out of the part, whichever way the
                    // face was wound
                    if (dotProduct(normal, subtractVectors(center, partCenter)) < 0) {
                        normal = normal.map((value) => -value);
                    }
                    return { points, center, normal, rgb: getFaceRgb(part, faceIndex, averagePoints(face)) };
                })
                // Faces turned away are hidden on solid parts, but on
                // see-through parts they are the inside walls showing through
                .filter(({ center, normal }) => dotProduct(normal, center) < 0 || part.alpha < 1)
                .map(({ points, center, normal, rgb }) => {
                    // An inside wall is lit from the side facing the eye
                    let litNormal = normal;
                    if (dotProduct(normal, center) > 0) {
                        litNormal = normal.map((value) => -value);
                    }
                    return {
                        depth: center[2],
                        draw: () => drawShadedFace(points, getLitColor(rgb, litNormal, center), part.alpha),
                    };
                });
        });

        drawables.sort((a, b) => b.depth - a.depth);
        for (const { draw: drawPiece } of drawables) {
            drawPiece();
        }

        drawNozzlePop(placement, nowMs);
        drawLaunchingBubbles(currentMaze, placement, camera, nowMs);
    }

    // Bubbles just fired, drawn in front of the blaster gliding from its
    // nozzle tip to where they really are in the maze, growing as they go.
    // They ease out, moving fast at first and settling into their path.
    function drawLaunchingBubbles(currentMaze, placement, camera, nowMs) {
        const tip = placeBlasterPoint([0, 0, BLASTER_NOZZLE_TIP_Z + BUBBLE_LAUNCH_RADIUS], placement);
        const [tipX, tipY] = projectBlasterPoint(tip);
        const tipRadius = (BLASTER_FOCAL_PX * BUBBLE_LAUNCH_RADIUS) / tip[2];

        for (const { x, y, bornMs } of currentMaze.bullets) {
            const launchShare = (nowMs - bornMs) / BUBBLE_LAUNCH_MS;
            if (launchShare >= 1) {
                continue;
            }
            const eased = 1 - (1 - launchShare) ** 2;

            let target = { x: tipX, y: tipY, radius: tipRadius };
            const view = projectPoint(camera, x, y);
            if (view !== null) {
                target = getWorldBubbleOnScreen(view, camera);
            }
            drawBubble(
                tipX + (target.x - tipX) * eased,
                tipY + (target.y - tipY) * eased,
                tipRadius + (target.radius - tipRadius) * eased,
                1
            );
        }
    }

    // One flat face of the blaster, as solid as alpha says. Solid faces get
    // a hairline of the same colour to hide the seams between neighbours;
    // see-through faces don't, or the doubled-up edges would show as lines.
    function drawShadedFace(points, color, alpha) {
        ctx.globalAlpha = alpha;
        ctx.fillStyle = color;
        ctx.beginPath();
        for (const point of points) {
            const [x, y] = projectBlasterPoint(point);
            ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        if (alpha === 1) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 1;
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
    }

    // A ball seen in front of the eye: a disc shaded smoothly from a glossy
    // highlight on the side toward the light to a dark rim
    function drawShadedBall(center, radius, rgb, alpha) {
        const [x, y] = projectBlasterPoint(center);
        const screenRadius = (BLASTER_FOCAL_PX * radius) / center[2];
        const shade = (amount) => {
            const [r, g, b] = rgb.map((channel) => Math.round(clamp(channel * amount, 0, 255)));
            return `rgb(${r}, ${g}, ${b})`;
        };
        const gradient = ctx.createRadialGradient(
            x - screenRadius * 0.38, y - screenRadius * 0.42, screenRadius * 0.05,
            x, y, screenRadius
        );
        gradient.addColorStop(0, "rgb(255, 255, 255)");
        gradient.addColorStop(0.18, shade(1.15));
        gradient.addColorStop(0.65, shade(0.85));
        gradient.addColorStop(1, shade(0.38));

        ctx.globalAlpha = alpha;
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.arc(x, y, screenRadius, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }

    // How the blaster sits right now: its usual spot and angle, shifted by
    // the sway of his walk and the kick of a recent shot
    function getBlasterPlacement(currentMaze, nowMs) {
        let [x, y, z] = BLASTER_POSITION;
        let pitch = BLASTER_PITCH_RADIANS;

        const walkDistance = getGuyWalkDistance(currentMaze.guy, nowMs);
        if (walkDistance !== null) {
            const phase = (walkDistance * HEAD_BOB_PER_SQUARE * Math.PI) / 2;
            x += 0.015 * Math.sin(phase);
            y += 0.012 * Math.abs(Math.sin(phase));
        }

        const sinceShotMs = nowMs - lastShotMs;
        if (sinceShotMs < BLASTER_KICK_MS) {
            const kick = 1 - sinceShotMs / BLASTER_KICK_MS;
            z -= BLASTER_KICK_BACK * kick;
            pitch += BLASTER_KICK_PITCH_RADIANS * kick;
        }

        return { position: [x, y, z], yaw: BLASTER_YAW_RADIANS, pitch };
    }

    // A point on the blaster model moved to where it sits in front of the
    // eye: tipped by pitch (positive tips the barrel up), turned by yaw
    // (negative turns it toward the left), then moved into place
    function placeBlasterPoint([x, y, z], { position, yaw, pitch }) {
        const tippedY = y * Math.cos(pitch) - z * Math.sin(pitch);
        const tippedZ = y * Math.sin(pitch) + z * Math.cos(pitch);
        const turnedX = x * Math.cos(yaw) + tippedZ * Math.sin(yaw);
        const turnedZ = -x * Math.sin(yaw) + tippedZ * Math.cos(yaw);
        return [turnedX + position[0], tippedY + position[1], turnedZ + position[2]];
    }

    // Where a point in front of the eye lands on screen
    function projectBlasterPoint([x, y, z]) {
        return [VIEW_W / 2 + (BLASTER_FOCAL_PX * x) / z, VIEW_H / 2 + (BLASTER_FOCAL_PX * y) / z];
    }

    // A face's colour: its plastic colour lit by ambient and diffuse light,
    // plus a white glossy shine where it catches the light toward the eye
    function getLitColor(rgb, normal, center) {
        const diffuse = Math.max(0, dotProduct(normal, BLASTER_LIGHT_DIRECTION));
        const toEye = normalizeVector(center.map((value) => -value));
        const halfway = normalizeVector(BLASTER_LIGHT_DIRECTION.map((value, i) => value + toEye[i]));
        const shine = Math.max(0, dotProduct(normal, halfway)) ** BLASTER_SHININESS;
        const [r, g, b] = rgb.map((channel) => clamp(
            channel * (BLASTER_AMBIENT + BLASTER_DIFFUSE * diffuse) + 255 * BLASTER_SPECULAR * shine, 0, 255
        ));
        return `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
    }

    // A ring spreading out from the nozzle and fading, just after a shot
    function drawNozzlePop(placement, nowMs) {
        const sinceShotMs = nowMs - lastShotMs;
        if (sinceShotMs < NOZZLE_POP_MS) {
            const popShare = sinceShotMs / NOZZLE_POP_MS;
            const tip = placeBlasterPoint([0, 0, BLASTER_NOZZLE_TIP_Z], placement);
            const [x, y] = projectBlasterPoint(tip);
            ctx.globalAlpha = 1 - popShare;
            ctx.strokeStyle = BUBBLE_EDGE_COLOR;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y, (BLASTER_FOCAL_PX * (0.05 + 0.12 * popShare)) / tip[2], 0, Math.PI * 2);
            ctx.stroke();
            ctx.globalAlpha = 1;
        }
    }

    // The blaster's parts, built once: a rounded body that tapers off at
    // the back, with an orange bezel at the front, a grip below, a barrel with two rings and
    // a flared nozzle, and a see-through bubble-soap tank on top. A tube or
    // box part is { faces, rgb, alpha, center }, faces being lists of model
    // points; a ball part is { center, radius, rgb, alpha }.
    let blasterParts = null;
    function getBlasterParts() {
        if (blasterParts === null) {
            blasterParts = [
                createBoxPart([0, 0.17, -0.04], [0.1, 0.24, 0.11], BLASTER_GRIP_RGB, BLASTER_GRIP_ALPHA),
                createCylinderPart(0.06, 0.09, -0.17, -0.12, BLASTER_BODY_RGB, BLASTER_BODY_ALPHA),
                createCylinderPart(0.09, 0.1, -0.12, -0.08, BLASTER_BODY_RGB, BLASTER_BODY_ALPHA),
                createCylinderPart(0.1, 0.1, -0.08, 0.2, BLASTER_BODY_RGB, BLASTER_BODY_ALPHA),
                createCylinderPart(0.106, 0.1, 0.2, 0.24, BLASTER_RING_RGB, BLASTER_RING_ALPHA),
                createCylinderPart(0.05, 0.05, 0.24, 0.62, BLASTER_BARREL_RGB, BLASTER_BARREL_ALPHA),
                createCylinderPart(0.064, 0.064, 0.34, 0.39, BLASTER_RING_RGB, BLASTER_RING_ALPHA),
                createCylinderPart(0.066, 0.066, 0.5, 0.55, BLASTER_RING_RGB, BLASTER_RING_ALPHA),
                createCylinderPart(0.055, 0.085, 0.6, BLASTER_NOZZLE_TIP_Z, BLASTER_RING_RGB, BLASTER_RING_ALPHA),
                { center: [0, -0.13, -0.02], radius: 0.065, rgb: BLASTER_TANK_RGB, alpha: BLASTER_TANK_ALPHA },
            ];
        }
        return blasterParts;
    }

    // A box with the given middle and size, as six faces
    function createBoxPart(center, size, rgb, alpha) {
        const [half0, half1, half2] = size.map((length) => length / 2);
        const corner = (signX, signY, signZ) => [
            center[0] + signX * half0,
            center[1] + signY * half1,
            center[2] + signZ * half2,
        ];
        const faces = [
            [corner(-1, -1, -1), corner(-1, 1, -1), corner(-1, 1, 1), corner(-1, -1, 1)],
            [corner(1, -1, -1), corner(1, -1, 1), corner(1, 1, 1), corner(1, 1, -1)],
            [corner(-1, -1, -1), corner(-1, -1, 1), corner(1, -1, 1), corner(1, -1, -1)],
            [corner(-1, 1, -1), corner(1, 1, -1), corner(1, 1, 1), corner(-1, 1, 1)],
            [corner(-1, -1, -1), corner(1, -1, -1), corner(1, 1, -1), corner(-1, 1, -1)],
            [corner(-1, -1, 1), corner(-1, 1, 1), corner(1, 1, 1), corner(1, -1, 1)],
        ];
        return { faces, rgb, alpha, center };
    }

    // A tube along the barrel line from zStart to zEnd, its radius going
    // from radiusStart to radiusEnd (so it can flare), with both ends capped.
    // Its wall is cut into slices no longer than BLASTER_TUBE_SLICE_LENGTH,
    // so the rainbow ring can light up just a thin band of it. The wall
    // faces are listed apart from the caps, as only the wall takes the ring.
    function createCylinderPart(radiusStart, radiusEnd, zStart, zEnd, rgb, alpha) {
        const sliceCount = Math.max(1, Math.ceil((zEnd - zStart) / BLASTER_TUBE_SLICE_LENGTH));
        const ringPoint = (slice, i) => {
            const share = slice / sliceCount;
            const radius = radiusStart + (radiusEnd - radiusStart) * share;
            const angle = (2 * Math.PI * i) / BLASTER_CYLINDER_SEGMENTS;
            return [radius * Math.cos(angle), radius * Math.sin(angle), zStart + (zEnd - zStart) * share];
        };
        const indexes = [...Array(BLASTER_CYLINDER_SEGMENTS).keys()];
        const wallFaces = [...Array(sliceCount).keys()].flatMap((slice) => indexes.map((i) => [
            ringPoint(slice, i),
            ringPoint(slice, i + 1),
            ringPoint(slice + 1, i + 1),
            ringPoint(slice + 1, i),
        ]));
        const startCap = indexes.map((i) => ringPoint(0, i));
        const endCap = indexes.map((i) => ringPoint(sliceCount, i));
        return {
            faces: [...wallFaces, startCap, endCap],
            wallFaceCount: wallFaces.length,
            rgb,
            alpha,
            center: [0, 0, (zStart + zEnd) / 2],
        };
    }

    // A polygon's facing direction (not yet unit length), worked out from
    // all its corners so faces with a repeated corner still get one
    function getPolygonNormal(points) {
        const normal = [0, 0, 0];
        points.forEach((current, i) => {
            const next = points[(i + 1) % points.length];
            normal[0] += (current[1] - next[1]) * (current[2] + next[2]);
            normal[1] += (current[2] - next[2]) * (current[0] + next[0]);
            normal[2] += (current[0] - next[0]) * (current[1] + next[1]);
        });
        return normal;
    }

    function averagePoints(points) {
        return [0, 1, 2].map((axis) => points.reduce((total, point) => total + point[axis], 0) / points.length);
    }

    function subtractVectors(a, b) {
        return a.map((value, i) => value - b[i]);
    }

    function dotProduct(a, b) {
        return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
    }

    // A bright, fully saturated colour for a hue in degrees (any number,
    // wrapping round the colour wheel), as [r, g, b]
    function hueToRgb(hue) {
        const wrapped = ((hue % 360) + 360) % 360;
        const channel = (offset) => {
            const k = (offset + wrapped / 60) % 6;
            return 255 * (1 - Math.max(0, Math.min(k, 4 - k, 1)));
        };
        return [channel(5), channel(3), channel(1)];
    }

    function normalizeVector(vector) {
        const length = Math.hypot(...vector) || 1;
        return vector.map((value) => value / length);
    }

    // Helper arrows for young players, like a compass round the crosshair.
    // Each chasing or frightened enemy within GUIDE_ENEMY_MAX_STEPS walking
    // steps gets an arrow pointing straight at it, as the crow flies (up
    // is straight ahead, down is behind), with its bug picture at the
    // arrow's tail. A far bug's arrow is tiny and faint; it grows and
    // brightens as the bug nears, and flashes once it is close. Once only a few
    // dots are left, a green arrow with a dot at its tail points the same
    // way at the nearest one by walking distance.
    function drawGuideArrows(currentMaze, camera, nowMs) {
        const [guySqX, guySqY] = getGuySquare(currentMaze);
        const distancesFromGuy = getPathDistances(currentMaze.walls, guySqX, guySqY);
        const centers = getEnemyCenters(currentMaze);
        currentMaze.enemies.forEach(([squareX, squareY], i) => {
            const steps = distancesFromGuy.get(wallKey(squareX, squareY));
            if (currentMaze.returningEnemyCorners.has(i) || steps === undefined || steps > GUIDE_ENEMY_MAX_STEPS) {
                return;
            }
            const { x, y } = centers[i];
            const turn = getTurnAngleToward(camera, getWrappedDeltaX(camera.x, x), y - camera.y);
            const nearness = 1 - steps / GUIDE_ENEMY_MAX_STEPS;
            const size = GUIDE_ARROW_MIN_SIZE_PX + (GUIDE_ARROW_MAX_SIZE_PX - GUIDE_ARROW_MIN_SIZE_PX) * nearness ** 2;
            const iconW = GUIDE_BUG_ICON_MIN_W_PX + (GUIDE_BUG_ICON_MAX_W_PX - GUIDE_BUG_ICON_MIN_W_PX) * nearness ** 2;
            const side = getBugCrawlSide(i, currentMaze.enemyHeadings[i], x, y, camera);
            const sprite = getEnemySprite(getEnemyColor(currentMaze, i, nowMs), isEnemyFrightened(currentMaze, i, nowMs), 0, side);

            // A close bug's arrow flashes
            const isBlinkOff = steps <= GUIDE_CLOSE_STEPS && Math.floor(nowMs / GUIDE_CLOSE_BLINK_MS) % 2 === 1;
            ctx.globalAlpha = GUIDE_FAR_ALPHA + (1 - GUIDE_FAR_ALPHA) * nearness;
            if (isBlinkOff) {
                ctx.globalAlpha = GUIDE_CLOSE_BLINK_ALPHA;
            }
            drawGuideArrow(
                VIEW_W / 2 + Math.sin(turn) * GUIDE_RING_RADIUS_X_PX,
                VIEW_H / 2 - Math.cos(turn) * GUIDE_RING_RADIUS_Y_PX,
                turn,
                size,
                getEnemyColor(currentMaze, i, nowMs),
                iconW / 2 + 2,
                (iconX, iconY) => ctx.drawImage(sprite, iconX - iconW / 2, iconY - iconW * 3 / 8, iconW, iconW * 3 / 4),
            );
            ctx.globalAlpha = 1;
        });

        const dotsLeft = currentMaze.dots.size + currentMaze.powerPellets.size;
        if (dotsLeft === 0 || dotsLeft > DOT_GUIDE_MAX_LEFT) {
            return;
        }
        const nearestDot = [...currentMaze.dots, ...currentMaze.powerPellets]
            .filter((key) => distancesFromGuy.has(key))
            .sort((a, b) => distancesFromGuy.get(a) - distancesFromGuy.get(b))[0];
        if (nearestDot === undefined) {
            return;
        }
        const [dotX, dotY] = nearestDot.split(",").map(Number);
        const turn = getTurnAngleToward(camera, getWrappedDeltaX(camera.x, dotX + 0.5), dotY + 0.5 - camera.y);
        const ringX = VIEW_W / 2 + Math.sin(turn) * GUIDE_RING_RADIUS_X_PX;
        const ringY = VIEW_H / 2 - Math.cos(turn) * GUIDE_RING_RADIUS_Y_PX;
        drawGuideArrow(ringX, ringY, turn, GUIDE_DOT_ARROW_SIZE_PX, DOT_COLOR, GUIDE_DOT_ICON_RADIUS_PX + 4, (iconX, iconY) => {
            ctx.fillStyle = DOT_COLOR;
            ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(iconX, iconY, GUIDE_DOT_ICON_RADIUS_PX, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        });
    }

    // How far the guy would have to turn to face along (dx, dy): 0 straight
    // ahead, positive to his right, up to PI either way
    function getTurnAngleToward(camera, dx, dy) {
        return Math.atan2(camera.dirX * dy - camera.dirY * dx, camera.dirX * dx + camera.dirY * dy);
    }

    // A filled arrowhead with a short tail, centred on (x, y), pointing
    // at angle (0 is up the screen, PI / 2 is right), edged in black, with
    // drawIcon(x, y) called to draw what it points to, iconGap past its tail
    function drawGuideArrow(x, y, angle, size, color, iconGap, drawIcon) {
        const iconReach = size + iconGap;
