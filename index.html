        drawIcon(x - Math.sin(angle) * iconReach, y + Math.cos(angle) * iconReach);

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.moveTo(0, -size);
        ctx.lineTo(size, 0);
        ctx.lineTo(size * 0.4, 0);
        ctx.lineTo(size * 0.4, size);
        ctx.lineTo(-size * 0.4, size);
        ctx.lineTo(-size * 0.4, 0);
        ctx.lineTo(-size, 0);
        ctx.closePath();
        ctx.lineJoin = "round";
        ctx.lineWidth = 3;
        ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
        ctx.stroke();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.restore();
    }

    function drawCrosshair() {
        ctx.strokeStyle = "rgba(255, 255, 255, 0.6)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(VIEW_W / 2 - 8, VIEW_H / 2);
        ctx.lineTo(VIEW_W / 2 + 8, VIEW_H / 2);
        ctx.moveTo(VIEW_W / 2, VIEW_H / 2 - 8);
        ctx.lineTo(VIEW_W / 2, VIEW_H / 2 + 8);
        ctx.stroke();
    }

    // The automap: the original flat 2D game in the top-right corner, drawn
    // at its own size and shrunk. Black floor, bevelled stone wall bars,
    // yellow dots and pellets, the enemies as their blocky shapes (grey or
    // flashing when frightened, a faint outline when walking back), and the
    // guy as his four-colour shape with a wedge showing his facing.
    function drawMinimap(currentMaze, camera, nowMs) {
        const mapW = worldCols * MAP_CELL_W;
        const mapH = worldRows * MAP_CELL_H;
        const left = VIEW_W - MINIMAP_MARGIN_PX - mapW * MINIMAP_SCALE;

        ctx.save();
        ctx.translate(left, MINIMAP_MARGIN_PX);
        ctx.scale(MINIMAP_SCALE, MINIMAP_SCALE);

        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, mapW, mapH);
        drawMapWalls(currentMaze.walls);

        ctx.fillStyle = DOT_COLOR;
        for (const key of currentMaze.dots) {
            const [x, y] = key.split(",").map(Number);
            ctx.beginPath();
            ctx.arc((x + 0.5) * MAP_CELL_W, (y + 0.5) * MAP_CELL_H, MAP_DOT_RADIUS_PX, 0, Math.PI * 2);
            ctx.fill();
        }
        for (const key of currentMaze.powerPellets) {
            const [x, y] = key.split(",").map(Number);
            drawRainbowBall((x + 0.5) * MAP_CELL_W, (y + 0.5) * MAP_CELL_H, MAP_PELLET_RADIUS_PX, nowMs);
        }

        // Enemies are the same bug pictures as in the 3D view, seen from the
        // same side and scuttling in step, a little bigger than a square so
        // they stand out
        const legFrame = Math.floor(nowMs / BUG_LEG_STEP_MS) % 2;
        getEnemyCenters(currentMaze).forEach(({ x, y }, i) => {
            const width = MAP_CELL_W * MAP_ENEMY_SCALE;
            const height = MAP_CELL_H * MAP_ENEMY_SCALE;
            const left = x * MAP_CELL_W - width / 2;
            const top = y * MAP_CELL_H - height / 2;
            const side = getBugCrawlSide(i, currentMaze.enemyHeadings[i], x, y, camera);
            let sprite = getEnemySprite(getEnemyColor(currentMaze, i, nowMs), isEnemyFrightened(currentMaze, i, nowMs), legFrame, side);
            if (currentMaze.returningEnemyCorners.has(i)) {
                sprite = getEnemySprite(RETURNING_ENEMY_COLOR, false, legFrame, side);
                ctx.globalAlpha = RETURNING_ENEMY_ALPHA;
            }
            ctx.drawImage(sprite, left, top, width, height);
            ctx.globalAlpha = 1;
        });

        const { x, y } = getGuyPosition(currentMaze.guy);
        const guyLeft = (x - 0.5) * MAP_CELL_W;
        const guyTop = (y - 0.5) * MAP_CELL_H;
        drawMapGuy(guyLeft, guyTop, MAP_GUY_COLORS);

        // Wedge just in front of him, pointing the way he looks
        const { angle } = currentMaze.guy;
        const centerX = x * MAP_CELL_W;
        const centerY = y * MAP_CELL_H;
        const reach = MAP_CELL_W * 0.8;
        ctx.fillStyle = MAP_FACING_WEDGE_COLOR;
        ctx.beginPath();
        ctx.moveTo(centerX + Math.cos(angle) * reach, centerY + Math.sin(angle) * reach);
        ctx.lineTo(centerX + Math.cos(angle + 0.45) * reach * 0.6, centerY + Math.sin(angle + 0.45) * reach * 0.6);
        ctx.lineTo(centerX + Math.cos(angle - 0.45) * reach * 0.6, centerY + Math.sin(angle - 0.45) * reach * 0.6);
        ctx.closePath();
        ctx.fill();

        ctx.restore();

        // Thin frame round the map
        ctx.strokeStyle = MAP_WALL_FACE_COLOR;
        ctx.lineWidth = 2;
        ctx.strokeRect(left - 1, MINIMAP_MARGIN_PX - 1, mapW * MINIMAP_SCALE + 2, mapH * MINIMAP_SCALE + 2);
    }

    // The [x, y, w, h] map-pixel rects that make up one wall square. A wall
    // is a bar through the middle of its square, half a square thick, with
    // arms that reach out to touch neighbouring walls.
    function getMapWallRects(walls, squareX, squareY) {
        const left = squareX * MAP_CELL_W;
        const top = squareY * MAP_CELL_H;
        const barLeft = left + MAP_CELL_W / 4;
        const barTop = top + MAP_CELL_H / 4;

        const hasUp = walls.has(wallKey(squareX, squareY - 1));
        const hasDown = walls.has(wallKey(squareX, squareY + 1));
        const hasLeft = walls.has(wallKey(squareX - 1, squareY));
        const hasRight = walls.has(wallKey(squareX + 1, squareY));

        // Straight runs span the whole square in one direction;
        // corners and junctions only reach toward the walls they touch
        const hasHorizontalNeighbour = hasLeft || hasRight;
        const hasVerticalNeighbour = hasUp || hasDown;
        const spansHorizontally = hasHorizontalNeighbour && !hasVerticalNeighbour;
        const spansVertically = hasVerticalNeighbour && !hasHorizontalNeighbour;

        const halfW = MAP_CELL_W / 2;
        const halfH = MAP_CELL_H / 2;
        const rects = [[barLeft, barTop, halfW, halfH]];
        if (hasLeft || spansHorizontally) {
            rects.push([left, barTop, halfW, halfH]);
        }
        if (hasRight || spansHorizontally) {
            rects.push([left + halfW, barTop, halfW, halfH]);
        }
        if (hasUp || spansVertically) {
            rects.push([barLeft, top, halfW, halfH]);
        }
        if (hasDown || spansVertically) {
            rects.push([barLeft, top + halfH, halfW, halfH]);
        }
        return rects;
    }

    // One path from all the wall rects, shifted diagonally by offset
    function createMapWallPath(rects, offset) {
        const path = new Path2D();
        for (const [x, y, w, h] of rects) {
            path.rect(x + offset, y + offset, w, h);
        }
        return path;
    }

    // The walls' outline, highlight and face paths for a maze, worked out
    // once since walls never change during a level
    const mapWallPathsByWalls = new WeakMap();
    function getMapWallPaths(walls) {
        if (!mapWallPathsByWalls.has(walls)) {
            const rects = [...walls].flatMap((key) => getMapWallRects(walls, ...key.split(",").map(Number)));
            mapWallPathsByWalls.set(walls, {
                wallPath: createMapWallPath(rects, 0),
                shiftedUpLeftPath: createMapWallPath(rects, -MAP_WALL_BEVEL_PX),
                shiftedDownRightPath: createMapWallPath(rects, MAP_WALL_BEVEL_PX),
            });
        }
        return mapWallPathsByWalls.get(walls);
    }

    // All walls are filled as one shape, so touching walls merge with no
    // seams and the bevel only runs along the outside edge
    function drawMapWalls(walls) {
        const { wallPath, shiftedUpLeftPath, shiftedDownRightPath } = getMapWallPaths(walls);

        ctx.save();
        ctx.clip(wallPath);

        // Shadow along the bottom-right edges
        ctx.fillStyle = MAP_WALL_DARK_COLOR;
        ctx.fill(wallPath);

        // Highlight along the top-left edges
        ctx.fillStyle = MAP_WALL_LIGHT_COLOR;
        ctx.fill(shiftedUpLeftPath);

        // Stone face, inset from both bevels
        ctx.clip(shiftedDownRightPath);
        ctx.fillStyle = MAP_WALL_FACE_COLOR;
        ctx.fill(shiftedUpLeftPath);

        ctx.restore();
    }

    // A guy's blocky shape with its top-left at (left, top) in map pixels:
    // a bar across the top and a leg down each side, with black filling the
    // space under the bar so dots don't show through
    function drawMapGuy(left, top, colors) {
        const block = MAP_BLOCK_PX;
        ctx.fillStyle = "#000";
        ctx.fillRect(left, top, MAP_CELL_W, MAP_CELL_H);

        const blocks = [
            [0, 0, colors.left], [0, 1, colors.left], [0, 2, colors.left],
            [1, 0, colors.top[0]], [2, 0, colors.top[1]],
            [3, 0, colors.right], [3, 1, colors.right], [3, 2, colors.right],
        ];
        for (const [col, row, color] of blocks) {
            ctx.fillStyle = color;
            ctx.fillRect(left + col * block, top + row * block, block, block);
        }
    }

    // Along the top of the status bar, left to right: the score, the level,
    // a little bubble blaster for each life left, a pie that fills in as
    // the level's dots are eaten, and the power time left while powered up.
    // The controls hint runs along the bottom.
    function drawStatusBar(nowMs) {
        ctx.fillStyle = HUD_BACKGROUND_COLOR;
        ctx.fillRect(0, VIEW_H, VIEW_W, HUD_HEIGHT_PX);

        const rowMiddleY = VIEW_H + HUD_ROW_MIDDLE_PX;
        ctx.fillStyle = HUD_TEXT_COLOR;
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";
        ctx.font = "bold 20px monospace";
        let x = HUD_LEFT_PX;
        for (const text of [String(score), `LEVEL ${level}`]) {
            ctx.fillText(text, x, rowMiddleY);
            x += ctx.measureText(text).width + HUD_GAP_PX;
        }

        for (let life = 0; life < livesLeft; life++) {
            drawLifeBlaster(x, rowMiddleY);
            x += HUD_LIFE_ICON_W_PX;
        }
        x += HUD_GAP_PX;

        const dotsLeft = maze.dots.size + maze.powerPellets.size;
        drawDotsPie(x + HUD_PIE_RADIUS_PX, rowMiddleY, 1 - dotsLeft / maze.startingDotCount);
        x += HUD_PIE_RADIUS_PX * 2 + HUD_GAP_PX;

        if (nowMs < maze.frightenedUntilMs) {
            ctx.fillStyle = HUD_TEXT_COLOR;
            ctx.fillText(`POWER ${Math.ceil((maze.frightenedUntilMs - nowMs) / 1000)}`, x, rowMiddleY);
        }

        ctx.textBaseline = "alphabetic";
        ctx.font = "13px monospace";
        ctx.fillStyle = HUD_HINT_COLOR;
        ctx.fillText(CONTROLS_HINTS[lastInputKind], 14, VIEW_H + 45);
    }

    // A tiny side view of the bubble blaster, pointing right, for one life,
    // with its left edge at x and centred on y
    function drawLifeBlaster(x, y) {
        ctx.fillStyle = toColor(BLASTER_GRIP_RGB, 1);
        ctx.beginPath();
        ctx.moveTo(x + 5, y + 2);
        ctx.lineTo(x + 11, y + 2);
        ctx.lineTo(x + 9, y + 10);
        ctx.lineTo(x + 3, y + 10);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = toColor(BLASTER_BODY_RGB, 1);
        ctx.beginPath();
        ctx.roundRect(x + 1, y - 3, 18, 7, 3);
        ctx.fill();
        ctx.fillStyle = toColor(BLASTER_BARREL_RGB, 1);
        ctx.fillRect(x + 18, y - 1.5, 6, 4);
        ctx.fillStyle = toColor(BLASTER_RING_RGB, 1);
        ctx.fillRect(x + 23, y - 3, 2.5, 7);

        ctx.fillStyle = toColor(BLASTER_TANK_RGB, 1);
        ctx.beginPath();
        ctx.arc(x + 8, y - 6, 4.5, 0, Math.PI * 2);
        ctx.fill();
    }

    // A pie centred on (x, y): an empty ring that fills in clockwise from
    // the top as eatenShare goes from 0 to 1
    function drawDotsPie(x, y, eatenShare) {
        ctx.fillStyle = HUD_PIE_EMPTY_COLOR;
        ctx.beginPath();
        ctx.arc(x, y, HUD_PIE_RADIUS_PX, 0, Math.PI * 2);
        ctx.fill();

        if (eatenShare > 0) {
            ctx.fillStyle = DOT_COLOR;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.arc(x, y, HUD_PIE_RADIUS_PX, -Math.PI / 2, -Math.PI / 2 + eatenShare * Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }

        ctx.strokeStyle = DOT_COLOR;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(x, y, HUD_PIE_RADIUS_PX, 0, Math.PI * 2);
        ctx.stroke();
    }

    // Shown until the player first clicks or presses a key: the game's name
    // and a play button over a dimmed view of the maze. The controls are in
    // the status bar.
    function drawStartScreen(nowMs) {
        ctx.fillStyle = "rgba(5, 8, 20, 0.72)";
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);

        // Three green rings over the title, like the ... of a Semgrep pattern
        ctx.strokeStyle = DOT_COLOR;
        ctx.lineWidth = 9;
        for (const offset of [-1, 0, 1]) {
            ctx.beginPath();
            ctx.arc(VIEW_W / 2 + offset * 48, VIEW_H / 2 - 128, 17, 0, Math.PI * 2);
            ctx.stroke();
        }

        drawOverlayTitle("PMAN", DOT_COLOR, nowMs);
        drawContinueButton("Play", nowMs);
    }

    // The view floods with the colour of the enemy that caught the guy,
    // filling in over DEATH_FADE_MS. Then a big word, a blaster for each
    // life left, and the button to go on.
    function drawDeathMessage(nowMs) {
        const fill = clamp((nowMs - deathMs) / DEATH_FADE_MS, 0, 1);
        ctx.globalAlpha = DEATH_MAX_ALPHA * fill;
        ctx.fillStyle = deathColor;
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        ctx.globalAlpha = 1;

        if (livesLeft === 0) {
            drawOverlayTitle("GAME OVER", "#ffffff", nowMs);
            drawContinueButton(CONTINUE_PROMPTS[lastInputKind], nowMs);
            return;
        }
        drawOverlayTitle("OOPS!", "#ffffff", nowMs);
        const livesWidth = livesLeft * HUD_LIFE_ICON_W_PX * OVERLAY_LIFE_SCALE;
        ctx.save();
        ctx.translate(VIEW_W / 2 - livesWidth / 2, VIEW_H / 2 + OVERLAY_LIVES_OFFSET_Y_PX);
        ctx.scale(OVERLAY_LIFE_SCALE, OVERLAY_LIFE_SCALE);
        for (let life = 0; life < livesLeft; life++) {
            drawLifeBlaster(life * HUD_LIFE_ICON_W_PX, 0);
        }
        ctx.restore();
        drawContinueButton(CONTINUE_PROMPTS[lastInputKind], nowMs);
    }

    // Level complete: the view dims, fireworks burst over it, a big word,
    // and once LEVEL_COMPLETE_MIN_MS has passed, the button to go on
    function drawLevelComplete(nowMs) {
        ctx.fillStyle = `rgba(5, 8, 20, ${LEVEL_COMPLETE_DIM_ALPHA})`;
        ctx.fillRect(0, 0, VIEW_W, VIEW_H);
        drawFireworks(nowMs - levelCompleteMs);
        drawOverlayTitle("YOU WIN!", DOT_COLOR, nowMs);
        if (nowMs - levelCompleteMs >= LEVEL_COMPLETE_MIN_MS) {
            drawContinueButton(CONTINUE_PROMPTS[lastInputKind], nowMs);
        }
    }

    // Every burst still in the air at elapsedMs. Burst k goes off at
    // k * FIREWORK_INTERVAL_MS; its place, colour and spark angles come
    // from k, so each burst looks the same on every frame.
    function drawFireworks(elapsedMs) {
        const newestBurst = Math.floor(elapsedMs / FIREWORK_INTERVAL_MS);
        const oldestBurst = Math.max(0, Math.ceil((elapsedMs - FIREWORK_LIFE_MS) / FIREWORK_INTERVAL_MS));
        for (let burst = oldestBurst; burst <= newestBurst; burst++) {
            const progress = (elapsedMs - burst * FIREWORK_INTERVAL_MS) / FIREWORK_LIFE_MS;
            const centerX = VIEW_W * (0.12 + 0.76 * getBurstRandom(burst, 1));
            const centerY = VIEW_H * (0.12 + 0.4 * getBurstRandom(burst, 2));
            const color = FIREWORK_COLORS[Math.floor(getBurstRandom(burst, 3) * FIREWORK_COLORS.length)];
            const spread = FIREWORK_SPREAD_PX * (0.6 + 0.6 * getBurstRandom(burst, 4)) * (1 - (1 - progress) ** 3);
            const fall = FIREWORK_GRAVITY_PX * progress ** 2;

            ctx.globalAlpha = 1 - progress;
            ctx.fillStyle = color;
            for (let spark = 0; spark < FIREWORK_SPARK_COUNT; spark++) {
                const angle = (spark / FIREWORK_SPARK_COUNT + getBurstRandom(burst, 5)) * Math.PI * 2;
                const reach = spread * (0.75 + 0.25 * getBurstRandom(burst * FIREWORK_SPARK_COUNT + spark, 6));
                ctx.beginPath();
                ctx.arc(centerX + Math.cos(angle) * reach, centerY + Math.sin(angle) * reach + fall, 2.6, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        ctx.globalAlpha = 1;
    }

    // A fixed number from 0 to 1 for this burst and purpose (salt), so a
    // burst keeps its look from frame to frame
    function getBurstRandom(burst, salt) {
        const value = Math.sin(burst * 12.9898 + salt * 78.233) * 43758.5453;
        return value - Math.floor(value);
    }

    // One big word just above the middle of the view, edged in black so it
    // reads on any colour, gently swelling and shrinking
    function drawOverlayTitle(title, color, nowMs) {
        const scale = 1 + OVERLAY_PULSE_SHARE * Math.sin((nowMs / OVERLAY_PULSE_MS) * Math.PI * 2);
        ctx.save();
        ctx.translate(VIEW_W / 2, VIEW_H / 2 - OVERLAY_TITLE_RAISE_PX);
        ctx.scale(scale, scale);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "rgba(0, 0, 0, 0.8)";
        ctx.fillStyle = color;
        ctx.font = "bold 76px sans-serif";
        ctx.lineWidth = 10;
        ctx.strokeText(title, 0, 0);
        ctx.fillText(title, 0, 0);
        ctx.restore();
    }

    // A green "▶ label" button under the title, pulsing to say press it
    function drawContinueButton(label, nowMs) {
        const text = `▶ ${label}`;
        const pulse = 0.5 + 0.5 * Math.sin((nowMs / OVERLAY_PULSE_MS) * Math.PI * 2);
        ctx.save();
        ctx.translate(VIEW_W / 2, VIEW_H / 2 + OVERLAY_BUTTON_OFFSET_Y_PX);
        ctx.font = "bold 26px sans-serif";
        const width = ctx.measureText(text).width + 44;
        ctx.globalAlpha = 0.75 + 0.25 * pulse;
        ctx.fillStyle = DOT_COLOR;
        ctx.beginPath();
        ctx.roundRect(-width / 2, -24, width, 48, 24);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = HUD_BACKGROUND_COLOR;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, 0, 1);
        ctx.restore();
    }
</script>

</body>
</html>
